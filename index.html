<script>
const notes=[[6, "第 1 站：戴上耳機時，哪些聲音還在？"], [1, "聲波疊加：為什麼加上一道聲音，反而可能變安靜？"], [2, "主動降噪與被動隔音：耳機的哪個部分在做事？"], [4, "相位與延遲：為什麼抵消聲晚到會出問題？"], [3, "人聲為什麼還聽得見：衰減、可聽見與聽懂是三件事"], [5, "如何評估降噪：三種狀態、頻率曲線與分貝"], [7, "麥克風放在哪？從前饋、回饋到混合降噪"], [8, "同一副耳機，為什麼要用不同聲音測？"], [9, "追蹤一聲風扇聲：從麥克風到補償聲"]];
const knowledge=["\u003ch3>核心概念\u003c/h3>\n\u003cp>從最熟悉的情境開始。你戴著耳機聽歌，旁邊有人說話。歌是耳機裡的小喇叭播放的。人聲則是從外面傳到你耳朵的。兩種聲音可以同時進到耳朵，降噪主要處理的是第二種。\u003c/p>\n\u003ch3>適用條件與推導\u003c/h3>\n\u003cp>以下以一般罩耳式耳機為例。這種耳機有罩住耳朵的外殼，外殼邊緣有一圈軟墊。若你用的是入耳式耳機，可以把這個接觸位置想成塞在耳道入口的耳塞。不同耳機貼合的程度各有差異。\u003c/p>\n\u003ch3>先認識耳機上的三樣東西\u003c/h3>\n\u003cp>\u003cstrong>小喇叭負責發聲。\u003c/strong> 手機把音樂交給耳機。耳機裡的小喇叭有一片會快速來回動的薄膜，薄膜推動周圍空氣，變化傳到耳朵，你就聽到聲音。把音樂暫停，這條音樂來源就停了。\u003c/p>\n\u003cp>\u003cstrong>耳罩和軟墊在耳朵外圍形成一道阻隔。\u003c/strong> 即使沒開機，只要戴上耳機，它仍可能擋住一部分外面的聲音。把耳罩稍微抬開時，多了一條空氣可以直接進出的縫隙，聽到的外界聲可能改變。「貼合」就是軟墊和頭部接觸得有多完整。\u003c/p>\n\u003cp>\u003cstrong>麥克風負責收聲。\u003c/strong> 和手機錄音一樣，麥克風把附近的聲音變化轉成耳機電子零件能處理的訊號。有些降噪耳機會用麥克風取得環境聲的資訊，稍後會用到它。\u003c/p>\n\u003ch3>一分鐘觀察\u003c/h3>\n\u003cp>找一個原本就有普通背景聲的地方，例如開著風扇的房間。全程不播音樂。先不戴耳機聽幾秒，再戴好耳機並關閉降噪，最後維持原本戴法開啟降噪。如果耳機沒有開關，只做前兩步即可。\u003c/p>\n\u003cp>第一次到第二次，變的是耳朵外面多了一層耳罩或耳塞。第二次到第三次，戴法維持原樣，增加的是降噪功能。兩次比較分別回答不同問題。這個小活動用聽感觀察，數字比較的方法放在最後一站。\u003c/p>\n\u003ch3>現在再給兩種作用名字\u003c/h3>\n\u003cp>戴上就可能產生的物理阻隔叫\u003cstrong>被動隔音\u003c/strong>。啟用電子功能後，耳機用麥克風取得外界聲的資訊，再用自己的小喇叭發出一道聲音，讓耳邊的外界聲降低。這叫\u003cstrong>主動降噪\u003c/strong>，英文 *Active Noise Cancellation*，縮寫 \u003cstrong>ANC\u003c/strong>。\u003c/p>\n\u003cp>耳機會播放另一道聲音，而且結果可能更安靜。要理解這一步，先看看空氣怎麼把聲音送到耳朵。\u003c/p>\n\u003ch3>常見疑問與自我檢查\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>音樂停了，為什麼外面的人還聽得到？\u003c/strong> 因為外面的人聲有自己的傳入路徑。\u003c/li>\n\u003cli>\u003cstrong>關掉主動降噪還有隔音，是開關壞了嗎？\u003c/strong> 耳罩還在耳朵上，被動隔音可以繼續作用。\u003c/li>\n\u003cli>\u003cstrong>要比較開關的影響，哪一步應該避免重戴？\u003c/strong> 從關閉切到開啟時維持戴法，才能把兩次的差異集中在開關。\u003c/li>\n\u003c/ol>\n\u003ch3>來源與延伸問題\u003c/h3>\n\u003cp>\u003ca href=\"https://www.bose.com/stories/how-do-noise-cancelling-headphones-work\">S02 耳機原理與貼合\u003c/a> · \u003ca href=\"https://openstax.org/books/university-physics-volume-1/pages/16-5-interference-of-waves\">S06 聲音如何在空氣傳播\u003c/a>\u003c/p>\n\u003cp>下一站是 \u003ca href=\"#wiki-1\">聲音怎麼在空氣中相加\u003c/a>。\u003c/p>", "\u003ch3>先從一個熟悉的例子開始\u003c/h3>\n\u003cp>你已經知道，外面的聲音和耳機喇叭的聲音都能傳到耳朵。現在想像有人輕拍桌面。你不用看到手掌，也聽得見那一下，因為桌面振動引起的空氣變化一路傳到耳朵。喇叭反覆推動空氣也是同樣的道理。\u003c/p>\n\u003cp>\u003cstrong>聲波\u003c/strong>是傳出去的擠壓與放鬆。\u003cstrong>聲壓變化\u003c/strong>是空氣當下比平均壓力高或低多少。把這個變化隨時間畫下來，就得到\u003cstrong>波形\u003c/strong>。看波形時，左右是時間，上下是當下的壓力變化。把手指放在圖上某一刻，先讀出那一刻比平常多擠多少，再往右看下一刻。\u003c/p>\n\u003cp>想像你每秒敲兩下，兩下之間是半秒。這裡的「每秒幾次」叫頻率，單位是赫茲（Hz）。「一次花多久」叫週期。把敲擊想成更快、更規律的振動，就接近下面用來算聲音的模型。\u003c/p>\n\u003ch3>核心概念\u003c/h3>\n\u003cp>聲音在空氣中造成壓力隨時間變化。在同一位置、同一時刻，兩道小振幅聲波的聲壓變化可以相加。若一道增加多少壓力，另一道就減少同樣多，該位置的合成聲壓變化便可為零；ANC 利用的正是這種疊加關係。\u003c/p>\n\u003ch3>適用條件與推導\u003c/h3>\n\u003cp>本頁用線性、同頻正弦波說明，觀察點固定在耳邊。完整抵消要求振幅相同、相位相反，而且必須持續對準，不能只在某一瞬間相加為零。真實耳機的聲場與路徑比此模型複雜。\u003c/p>\n\u003ch3>圖上的正負代表什麼？\u003c/h3>\n\u003cp>零線是當地的平均壓力，通常接近大氣壓；正值表示比平均壓力稍高，負值表示稍低。負聲壓變化不是「負的絕對壓力」，也不是空氣中出現負能量。\u003c/p>\n\u003cp>固定耳邊的位置，可把純音寫成 \u003ccode>p(t) = A sin(2πft + φ)\u003c/code>。A 決定壓力擾動幅度，f 決定每秒重複次數，φ 決定週期從哪一段開始。因此「音比較高」不等於「振幅比較大」。聲壓模型見 \u003ca href=\"https://openstax.org/books/university-physics-volume-1/pages/16-5-interference-of-waves\">S06 §17.1\u003c/a>。\u003c/p>\n\u003ch3>一個瞬間相消，不等於整段聲音相消\u003c/h3>\n\u003cp>\u003cstrong>自行設計的例子\u003c/strong>：某時刻兩道波分別為 +0.8 Pa、−0.8 Pa，合成為零；下一時刻若是 +0.4 Pa、−0.1 Pa，就留下 +0.3 Pa。第一個時刻為零，不能證明整段聲音消失。\u003c/p>\n\u003cp>持續的理想抵消要求每一時刻滿足 \u003ccode>p2(t) = −p1(t)\u003c/code>。對同頻正弦波而言，等振幅、相差半個週期可做到這件事。\u003ca href=\"https://openstax.org/books/physics/pages/13-3-wave-interaction-superposition-and-interference\">S01\u003c/a> 的同相與反相圖呈現這兩個極端情況。\u003c/p>\n\u003ch3>相位差如何決定合成振幅？\u003c/h3>\n\u003cp>先認兩個圖上的特徵。離中線最遠的距離叫\u003cstrong>振幅\u003c/strong>。如果兩道規律的波重複得一樣快，可以比較它們的波峰出現時刻。兩個波峰若隔了半輪，就說它們的\u003cstrong>相位差\u003c/strong>是 180°。這裡把一整輪當成 360°，好比在錶面上繞一圈。\u003c/p>\n\u003cp>設兩道波振幅都為 A，總相位差為 φ。根據 S06 §16.5 的正弦和公式：\u003c/p>\n\u003cpre style=\"overflow:auto\">\u003ccode>p1(t) = A sin(ωt)\np2(t) = A sin(ωt + φ)\n合成振幅 R = 2A |cos(φ/2)|，其中 ω = 2πf\u003c/code>\u003c/pre>\n\u003cdiv style=\"overflow:auto\">\u003ctable>\n\u003ctr>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">總相位差\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">R/A\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">解讀\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">0°\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">2.00\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">波峰對波峰，振幅加倍\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">90°\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">約 1.41\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">部分相長、部分相消\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">180°\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">0.00\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">波峰對等大波谷，理想相消\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>這就是簡報滑桿的模型。這裡比較聲壓振幅，不是主觀響度；不能把振幅加倍直接說成「聽起來兩倍大聲」。\u003c/p>\n\u003cp>入門讀圖可先用三條規律的波。A 在同一段時間內重複兩次。B 保持 A 的高度、重複四次。C 保持 A 的兩次、但離中線更遠。A 比 B 時先數波峰，A 比 C 時再量高度。用簡單數字看瞬間疊加，可以把同向的 +1 和 +1 加成 +2，把 +1 和 −1 加成 0，再試 +1 和 −0.8 得到 +0.2。這些都是教學示意。\u003c/p>\n\u003ch3>振幅不一樣，能歸零嗎？\u003c/h3>\n\u003cp>\u003cstrong>自行推導\u003c/strong>：同頻兩波的振幅為 A、B 時，\u003ccode>R² = A² + B² + 2AB cos φ\u003c/code>。將 φ 設為 180°，得到殘餘振幅 \u003ccode>R = |A − B|\u003c/code>。噪音為 1 Pa、補償聲為 0.8 Pa，即使時機完美對準，仍剩 0.2 Pa。相位與振幅都要匹配。\u003c/p>\n\u003cp>此式可由展開兩正弦波推導，不是耳機實測結果。若頻率不同，也不能用單一固定相位差代表整段訊號；需要逐時刻計算或分頻率分析。\u003c/p>\n\u003ch3>為什麼不能讓整個房間一起安靜？\u003c/h3>\n\u003cp>移動位置會改變兩條傳播路徑，因而改變到達時間及相位。在一個位置相消，換個位置可能只部分相消，甚至相長。S01 的立體聲例子也說明干涉會隨位置改變。\u003c/p>\n\u003cp>因此 ANC 要處理的是「耳邊剩下多少」，不能只把某處麥克風錄音乘上 −1，就假定任何位置都能抵消。播放與傳播路徑的影響，接著讀 \u003ca href=\"#wiki-4\">phase-and-delay\u003c/a>。\u003c/p>\n\u003ch3>常見誤解\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>分貝可以像瞬時聲壓直接相加。\u003c/strong> 分貝是對數表示；先確定要合成的是哪一種物理量。見 \u003ca href=\"#wiki-5\">measurement\u003c/a>。\u003c/li>\n\u003cli>\u003cstrong>某個波峰對上一個波谷就成功。\u003c/strong> 還要等振幅，並持續對準後續波形。\u003c/li>\n\u003cli>\u003cstrong>單點壓力為零代表所有聲能消失。\u003c/strong> 本頁沒有建立整個聲場的能量收支，不能由單點為零推論整個空間沒有聲能。\u003c/li>\n\u003c/ul>\n\u003ch3>自我檢查\u003c/h3>\n\u003col>\n\u003cli>反相後頻率是不是減半？\u003cstrong>不是；理想完全相消時沒有殘餘週期波，不是產生半頻率的聲音。\u003c/strong>\u003c/li>\n\u003cli>振幅 A 和 1.2A 完美反相後剩多少？\u003cstrong>0.2A。\u003c/strong>\u003c/li>\n\u003cli>一個瞬間合成為零，能判定整段為零嗎？\u003cstrong>不能，還需核對所有後續時刻。\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003ch3>來源與延伸問題\u003c/h3>\n\u003cp>\u003ca href=\"https://openstax.org/books/physics/pages/13-3-wave-interaction-superposition-and-interference\">S01\u003c/a> 支持疊加與空間差異；\u003ca href=\"https://openstax.org/books/university-physics-volume-1/pages/16-5-interference-of-waves\">S06\u003c/a> 支持相位公式及聲壓模型。公式延伸與數值例子標為自行推導。\u003c/p>\n\u003cp>前往 \u003ca href=\"#wiki-4\">phase-and-delay\u003c/a>、\u003ca href=\"#wiki-2\">active-and-passive\u003c/a>。待研究：多頻率波形如何分解？空間相消區域多大？目前未求解真實耳罩的三維聲場。\u003c/p>", "\u003ch3>先從一個熟悉的例子開始\u003c/h3>\n\u003cp>回想 \u003ca href=\"#wiki-6\">第一站的風扇活動\u003c/a>：從裸耳到戴好耳機，你增加了一層會擋聲的耳罩。接著保持原本戴法打開降噪，此時增加的是電子功能。先分開這兩個動作，再看功能怎麼做。\u003c/p>\n\u003cp>跟著一聲風扇低鳴走。聲音從外面往耳朵傳，同時也能被耳機上的麥克風收進來。麥克風收聲，喇叭發聲，中間有一個負責運算的電子元件。它們分別提供資訊、決定怎麼發聲，以及把發聲的結果送回空氣。這三件事各有不同用途。\u003c/p>\n\u003ch3>核心概念\u003c/h3>\n\u003cp>被動隔音靠耳機與耳朵間的物理結構改變外界聲音的傳入；主動降噪加入麥克風、訊號處理與喇叭，產生補償聲，降低耳邊殘餘噪音。兩者可同時工作，戴上耳機變安靜並不全是 ANC 的功勞。\u003c/p>\n\u003ch3>適用條件與推導\u003c/h3>\n\u003cp>本頁描述一般原理，以前饋控制作工程例子，不把所有耳機視為相同架構。比較需固定佩戴、聲場與模式；廠商介紹不等於所有產品的量化效能保證。\u003c/p>\n\u003ch3>被動隔音：改變聲音傳入路徑\u003c/h3>\n\u003cp>耳罩、襯墊、耳塞及密合程度形成物理邊界；不需先錄音或運算，就會影響聲音傳入。\u003ca href=\"https://www.bose.com/stories/how-do-noise-cancelling-headphones-work\">S02\u003c/a> 將耳罩、襯墊與貼合作為被動隔音的來源。\u003c/p>\n\u003cp>所以戴著但關閉 ANC，仍可能比裸耳安靜。反過來，即使開關沒變，重新戴一次也可能改變結果。這是依貼合影響隔音所做的比較設計推論；具體差多少仍需測量，不能只憑「戴得更緊」猜出 dB 值。\u003c/p>\n\u003ch3>ANC 的兩條路徑在哪裡相遇？\u003c/h3>\n\u003cp>以前饋式作教學示意：\u003c/p>\n\u003cpre style=\"overflow:auto\">\u003ccode>外界噪音 ──主要聲學路徑────────────→ 耳邊噪音\n    └→ 參考麥克風 → 控制器 → 喇叭／次要路徑 → 補償聲\n耳邊殘餘 = 耳邊噪音 + 耳邊補償聲\u003c/code>\u003c/pre>\n\u003cp>麥克風提供參考訊號，控制器決定喇叭輸入。但「送給喇叭的電訊號」與「耳邊出現的聲壓」不同，還經過轉換與傳播路徑。\u003ca href=\"https://pubmed.ncbi.nlm.nih.gov/29604695/\">S04\u003c/a> 摘要討論主要／次要路徑匹配與相對延遲；上圖是根據這個關係整理的示意，不是論文裝置圖。\u003c/p>\n\u003ch3>為什麼不能只把錄音乘上 −1？\u003c/h3>\n\u003cp>根據 \u003ca href=\"#wiki-1\">superposition\u003c/a>，要在耳邊持續形成等振幅、反相的關係。麥克風與耳邊位置不同，加上播放路徑的幅度變化與延遲，電訊號反相不保證耳邊聲壓也恰好反相。\u003c/p>\n\u003cp>控制問題因此是「如何得到所需的耳邊補償聲」，不只是能不能錄下環境聲。\u003ca href=\"#wiki-4\">phase-and-delay\u003c/a> 的 1 ms 算例可以幫助理解這個落差。本頁尚未涵蓋回饋及混合式架構的完整實作。\u003c/p>\n\u003ch3>三個狀態，分開不同效果\u003c/h3>\n\u003cp>以下是\u003cstrong>教學假設數據\u003c/strong>，不是任何產品實測。各數值代表同一頻帶、相同分析定義下的聲壓級：\u003c/p>\n\u003cdiv style=\"overflow:auto\">\u003ctable>\n\u003ctr>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">狀態\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">耳邊聲壓級\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">與前一狀態的差異\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">裸耳\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">70 dB\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">基準\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">戴好、ANC 關閉\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">60 dB\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">少 10 dB\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">維持佩戴、ANC 開啟\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">45 dB\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">再少 15 dB\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>裸耳到開啟的整體差異為 25 dB，這次啟用 ANC 的額外差異為 15 dB。不能把 25 dB 全算成 ANC 的額外效果。\u003ca href=\"https://www.rtings.com/headphones/tests/isolation\">S05\u003c/a> 的方法也比較這三種狀態；分貝換算見 \u003ca href=\"#wiki-5\">measurement\u003c/a>。\u003c/p>\n\u003ch3>沒有播放音樂，ANC 還能工作嗎？\u003c/h3>\n\u003cp>S02 說明，ANC 可在沒有音樂時降低外界聲音。音樂是另一個到達耳邊的訊號，可能改變你對背景聲的感受。因此比較 ANC 時，先關閉音樂能少一個干擾因素。\u003c/p>\n\u003cp>「播放音樂讓我沒注意到外界」與「外界聲音的量測值降低」不是同一證據。若同時改變音樂音量與 ANC，就無法把體感差異只歸給降噪。\u003c/p>\n\u003ch3>常見誤解\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>關閉 ANC 等於裸耳。\u003c/strong> 被動結構仍在，設備運作狀態也需要記錄。\u003c/li>\n\u003cli>\u003cstrong>所有頻率都有同樣衰減。\u003c/strong> 要看各頻帶曲線，不能只看一個總分。\u003c/li>\n\u003cli>\u003cstrong>通話麥克風降噪等於耳邊 ANC。\u003c/strong> 如果功能處理的是送給對方的訊號，觀察點就不同。先確認處理哪條訊號，再談效果。\u003c/li>\n\u003c/ul>\n\u003ch3>自我檢查\u003c/h3>\n\u003col>\n\u003cli>裸耳 70、關閉 55、開啟 50 dB，ANC 額外差多少？\u003cstrong>5 dB；整體差異為 20 dB。\u003c/strong>\u003c/li>\n\u003cli>開關中途重新戴耳機，為什麼結論變弱？\u003cstrong>同時改變了佩戴與開關兩項條件。\u003c/strong>\u003c/li>\n\u003cli>反相電訊號等於耳邊反相聲壓嗎？\u003cstrong>不一定，還有播放與傳播路徑。\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003ch3>來源與延伸問題\u003c/h3>\n\u003cp>\u003ca href=\"https://www.bose.com/stories/how-do-noise-cancelling-headphones-work\">S02\u003c/a>：主動／被動分工及無音樂運作；\u003ca href=\"https://pubmed.ncbi.nlm.nih.gov/29604695/\">S04\u003c/a>：路徑與延遲；\u003ca href=\"https://www.rtings.com/headphones/tests/isolation\">S05\u003c/a>：三狀態比較；\u003ca href=\"https://openstax.org/books/university-physics-volume-1/pages/16-5-interference-of-waves\">S06\u003c/a>：疊加模型。\u003c/p>\n\u003cp>前往 \u003ca href=\"#wiki-3\">speech-residual\u003c/a>、\u003ca href=\"#wiki-5\">measurement\u003c/a>。待研究：前饋、回饋與混合式架構的穩定性和取捨；需要另補工程來源，不在此冒充已完整回答。\u003c/p>\n\u003cp>想從零件追到乘加算例，接著讀 \u003ca href=\"#wiki-9\">追蹤一聲風扇聲\u003c/a>。\u003c/p>", "\u003ch3>先從一個熟悉的例子開始\u003c/h3>\n\u003cp>如果兩個人要一起拍手，其中一人晚半拍，原本應該重合的拍手時刻就會錯開。耳機遇到相近的問題。它發出用於抵消的補償聲時，這道聲得在外界噪音抵達耳邊時配合得上。\u003c/p>\n\u003cp>\u003cstrong>延遲\u003c/strong>就是晚到多長時間。\u003cstrong>相位\u003c/strong>說的是一輪重複走到哪裡，像時鐘指針走到哪一格。兩道波在各自的循環中錯開多少，叫相位差。先記住起伏最快的波在相同時間內走過更多輪，下面再把這個直覺化成數字。\u003c/p>\n\u003ch3>核心概念\u003c/h3>\n\u003cp>延遲是「晚了多少時間」，相位差是「在一個週期裡錯開多少」。同樣晚到 1 ms，對不同頻率會形成不同的相位誤差；能否抵消，還要看兩道波原本的相位及振幅。\u003c/p>\n\u003ch3>適用條件與推導\u003c/h3>\n\u003cp>以下固定耳邊同一位置，假設噪音為單頻正弦波、系統線性、補償聲與噪音等振幅。時間使用秒；相位誤差先取未折返的數值，計算波形時再按 360° 週期理解。這些是教學模型，不是耳機效能規格。\u003c/p>\n\u003ch3>先理解一圈是多少時間\u003c/h3>\n\u003cp>頻率 f 表示每秒重複幾次，週期 T = 1/f。一圈為 360°，因此額外延遲 τ 對應的相位誤差大小為：\u003c/p>\n\u003cpre style=\"overflow:auto\">\u003ccode>Δφ = 360° × τ/T = 360° × f × τ\n（若用弧度，δ = 2πfτ）\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>自行推導\u003c/strong>：以週期與相位的定義換算，並非論文中的實測結果。若把晚到寫入正弦波，時間變成 t − τ，對應相位變化的符號為負；這裡用誤差大小討論殘餘振幅。\u003c/p>\n\u003ch3>算一次：同樣晚到 1 ms\u003c/h3>\n\u003cdiv style=\"overflow:auto\">\u003ctable>\n\u003ctr>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">頻率\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">週期\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">延遲佔一圈\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">相位誤差大小\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">100 Hz\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">10 ms\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">1/10\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">36°\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">250 Hz\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">4 ms\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">1/4\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">90°\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">500 Hz\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">2 ms\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">1/2\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">180°\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>這說明在固定延遲下，相位誤差隨頻率增加。但不能直接推成「頻率越高，真實降噪一定越差」：純單頻模型有週期性，實際耳機還有頻率響應、控制路徑與幅度誤差。\u003c/p>\n\u003ch3>從相位誤差算出剩下多少聲音\u003c/h3>\n\u003cp>設噪音 p(t) = A sin(2πft)。原本完美對準的補償聲是 −A sin(2πft)。若補償聲額外晚到 τ，兩者相加為：\u003c/p>\n\u003cpre style=\"overflow:auto\">\u003ccode>r(t) = A sin(2πft) − A sin(2πf(t − τ))\n殘餘振幅 R = 2A |sin(πfτ)| = 2A |sin(δ/2)|\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>自行推導\u003c/strong>：由正弦差公式或教材的相位疊加式得到。這裡的 δ 是相對「原本完美抵消」增加的誤差，不是兩波原本的總相位差。\u003c/p>\n\u003cdiv style=\"overflow:auto\">\u003ctable>\n\u003ctr>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">額外相位誤差\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">殘餘振幅 R/A\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">解讀\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">0°\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">0.00\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">理想上完全抵消\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">36°\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">約 0.62\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">尚有殘餘，但小於原噪音振幅\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">90°\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">約 1.41\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">殘餘已大於單獨噪音的振幅\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">180°\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">2.00\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">原本反相的補償變成同向疊加\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>因此 100 Hz、1 ms 的例子得到約 0.62A；500 Hz、1 ms 得到 2A。以上比較的是聲壓振幅，不能把 0.62 倍直接說成「主觀音量剩 62%」。\u003c/p>\n\u003ch3>為什麼簡報滑桿使用另一個公式？\u003c/h3>\n\u003cp>簡報第 6 頁滑桿的 φ 從「兩波完全對齊」開始，所以使用 2A |cos(φ/2)|，0° 為 2A，180° 為零。本頁的 δ 從「兩波原本恰好抵消」開始，用 2A |sin(δ/2)| 計算額外錯位造成的殘餘。先問自己數字是從哪個狀態起算，再選公式。\u003c/p>\n\u003ch3>接回真實 ANC\u003c/h3>\n\u003cp>\u003ca href=\"https://pubmed.ncbi.nlm.nih.gov/29604695/\">S04 研究摘要\u003c/a> 明確討論主要與次要路徑的相對延遲，並以訊號處理降低次要路徑有效轉換延遲。它支持「路徑時序重要」這一點，但不等於量出上述每個理想模型數值。\u003c/p>\n\u003cp>目前的模型也沒有納入振幅不匹配、複雜頻譜、多路徑與佩戴變動。即使相位完美反向，若兩波振幅分別為 A 和 B，也只能抵消到 |A − B|；「只調相位就一定歸零」是不完整的說法。\u003c/p>\n\u003ch3>自我檢查\u003c/h3>\n\u003col>\n\u003cli>200 Hz 晚到 0.5 ms，相位誤差多少？\u003cstrong>36°\u003c/strong>：360 × 200 × 0.0005。\u003c/li>\n\u003cli>為什麼同樣是 0°，簡報顯示加倍，本頁卻顯示零？\u003cstrong>兩者分別量總相位差與相對理想抵消的誤差。\u003c/strong>\u003c/li>\n\u003cli>若補償聲振幅只有噪音的 80%，反相後能完全消失嗎？\u003cstrong>不能，理想殘餘仍為原噪音振幅的 20%。\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003ch3>來源與延伸問題\u003c/h3>\n\u003cul>\n\u003cli>\u003ca href=\"https://openstax.org/books/university-physics-volume-1/pages/16-5-interference-of-waves\">S06 教材\u003c/a>：相位、週期與線性疊加；\u003ca href=\"https://openstax.org/books/university-physics-volume-1/pages/16-2-mathematics-of-waves\">16.2\u003c/a>、\u003ca href=\"https://openstax.org/books/university-physics-volume-1/pages/16-5-interference-of-waves\">16.5\u003c/a>。\u003c/li>\n\u003cli>\u003ca href=\"https://pubmed.ncbi.nlm.nih.gov/29604695/\">S04 論文摘要\u003c/a>：相對路徑延遲的工程重要性；\u003ca href=\"https://pubmed.ncbi.nlm.nih.gov/29604695/\">PubMed\u003c/a>。\u003c/li>\n\u003cli>前置概念：\u003ca href=\"#wiki-1\">superposition\u003c/a>；教學應用：\u003ca href=\"#1\">outline\u003c/a>。\u003c/li>\n\u003cli>待研究：數位濾波器的延遲如何分配？參考麥克風能提前得到多少資訊？多頻率噪音下如何設計補償？這些問題尚未由本篇解答。\u003c/li>\n\u003c/ul>", "\u003ch3>先從一個熟悉的例子開始\u003c/h3>\n\u003cp>想像你一開始聽到風扇和朋友說話。開啟耳機的主動降噪後，風扇沒那麼明顯，朋友也變小聲，但句子還聽得懂。請分成三個問題：朋友的聲音有沒有變小？你有沒有察覺有人在說話？你辨認出哪些字？把這三件事分開，就知道接下來該觀察什麼。\u003c/p>\n\u003cp>後文說的\u003cstrong>頻帶\u003c/strong>，是把由低到高的頻率分成幾段，像把琴鍵分成低音區和高音區。\u003cstrong>衰減\u003c/strong>就是某道聲音或某段頻率變弱。兩個頻帶衰減不同，表示它們留下的比例不一樣。\u003c/p>\n\u003ch3>核心概念\u003c/h3>\n\u003cp>「還聽得見」只說明有可感知的殘餘聲音，不能證明聲音沒有變小；「聽得懂」還涉及殘餘內容與背景情境。討論降噪時，應把物理衰減、是否察覺聲音及是否理解話語分開。\u003c/p>\n\u003ch3>適用條件與推導\u003c/h3>\n\u003cp>本頁結合廠商說明與語音測試方法，提出可檢查的解釋；沒有測量特定耳機，也沒做詞句辨識實驗。例子均為自行設計，不能當產品結論或辨識率預測。\u003c/p>\n\u003ch3>人聲不是固定頻率的純音\u003c/h3>\n\u003cp>\u003ca href=\"#wiki-1\">superposition\u003c/a> 的純音模型把振幅與頻率固定。說話的音節、停頓及強弱則隨時間變化，也包含不同頻率成分；不能找出一個「人聲頻率」，就當作整句話的全部。\u003c/p>\n\u003cp>\u003ca href=\"https://www.bose.com/stories/how-do-noise-cancelling-headphones-work\">S02\u003c/a> 的 FAQ 提到語音變化較快、聲音範圍較廣，可以被減弱但不一定完全阻擋。這是一般性廠商說明，沒有提供可套用所有耳機的固定衰減值。\u003c/p>\n\u003ch3>不同頻帶，留下的比例可能不同\u003c/h3>\n\u003cp>\u003cstrong>自行設計的模型\u003c/strong>：某聲音含低頻與較高頻成分，耳機對兩者分別衰減 20 dB、5 dB。結果不是整段均勻變小，而是不同成分以不同比例留下。\u003c/p>\n\u003cp>因此「轟鳴減弱，但話仍能辨認」並不矛盾：訊號組成與衰減都不只一個數字。但這個模型無法預測某句話剩下哪些語音線索；仍需錄音、頻率分析及聽者測試。\u003c/p>\n\u003cp>也不能只歸因於「人聲變化太快」；\u003ca href=\"#wiki-4\">phase-and-delay\u003c/a> 的路徑誤差、\u003ca href=\"#wiki-2\">active-and-passive\u003c/a> 的佩戴及結構，以及各頻率實際響應，都可能影響結果。\u003c/p>\n\u003ch3>三個問題，需要三種證據\u003c/h3>\n\u003cdiv style=\"overflow:auto\">\u003ctable>\n\u003ctr>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">問題\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">可用的觀察\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">不能代替它的東西\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">語音物理上減弱多少？\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">固定條件錄音，依明確指標比較\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">一句「我還聽得到」\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">能察覺有人說話嗎？\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">聲音有／無的偵測任務\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">單一頻帶衰減值\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">能理解多少內容？\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">未預先知道的詞句辨識結果\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">僅觀察波形變小\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>這是本專案的分析框架。聲音與聽覺的區別見 \u003ca href=\"https://openstax.org/books/university-physics-volume-1/pages/16-5-interference-of-waves\">S06 §17.1\u003c/a>；標準化辨識實驗的程序仍需另補專門資料。\u003c/p>\n\u003ch3>回到飛機上，哪些結論成立？\u003c/h3>\n\u003cp>假設開啟 ANC 後，你覺得引擎聲變小，仍聽懂鄰座的問題。最低限度只能說：背景噪音感受改變，而且仍保留足夠線索理解那句話。不能斷定「人聲完全沒有衰減」，也不知道人聲減少幾 dB。\u003c/p>\n\u003cp>還有一個\u003cstrong>待驗證假說\u003c/strong>：背景若比語音減得更多，語音相對背景可能變突出。以相同指標的示意數據，語音由 60 降至 55 dB，背景由 65 降至 45 dB，兩者差值便由 −5 變為 +10 dB。\u003c/p>\n\u003cp>語音本身變小，與背景的相對關係卻改善。這只是條件式算例，不代表真實耳機一定如此，也不保證辨識率；相對電平與辨識之間還有其他因素。\u003c/p>\n\u003ch3>怎麼驗證，而不是靠印象猜？\u003c/h3>\n\u003cp>\u003ca href=\"https://www.rtings.com/headphones/tests/isolation\">S05\u003c/a> 的 Voice Handling 方法播放語音樣本，觀察耳機的衰減。依此可規劃一輪教學實驗：\u003c/p>\n\u003col>\n\u003cli>固定佩戴、播放位置、語音及背景，關閉音樂與環境音穿透模式。\u003c/li>\n\u003cli>比較 ANC 開關時的耳邊錄音。若沒有校準設備，只報定性差異，不宣稱絕對 dB。\u003c/li>\n\u003cli>另外記錄詞句辨識，避免把波形變小直接等同聽不懂。\u003c/li>\n\u003cli>任何重戴或模式變更都記錄；條件改變就重做可比較的組別。\u003c/li>\n\u003c/ol>\n\u003cp>這是尚未執行的實驗規劃，不是本專案已完成的實測。\u003c/p>\n\u003ch3>常見誤解\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>ANC 完全不處理人聲。\u003c/strong> 聲源名稱不是排除清單，要看聲音組成、路徑及實際測試。\u003c/li>\n\u003cli>\u003cstrong>聽懂就代表沒有降噪。\u003c/strong> 辨識成功不能代替開關前後的物理比較。\u003c/li>\n\u003cli>\u003cstrong>聽起來更清楚代表語音更大聲。\u003c/strong> 語音與背景的相對關係也可能改變。\u003c/li>\n\u003cli>\u003cstrong>聽熟悉錄音就能量辨識能力。\u003c/strong> 已知內容可能影響判讀，需設計適當任務。\u003c/li>\n\u003c/ul>\n\u003ch3>自我檢查\u003c/h3>\n\u003col>\n\u003cli>人聲減弱 8 dB，但仍聽得懂，矛盾嗎？\u003cstrong>不矛盾；物理變小與辨識成功可同時成立。\u003c/strong>\u003c/li>\n\u003cli>一次沒聽懂，能說人聲完全消失嗎？\u003cstrong>不能，背景、內容與聽者狀況也可能影響結果。\u003c/strong>\u003c/li>\n\u003cli>想知道減弱多少，先缺什麼？\u003cstrong>可比較條件、清楚定義的指標及開關前後資料。\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003ch3>來源與延伸問題\u003c/h3>\n\u003cp>\u003ca href=\"https://www.bose.com/stories/how-do-noise-cancelling-headphones-work\">S02\u003c/a>：一般語音限制；\u003ca href=\"https://www.rtings.com/headphones/tests/isolation\">S05\u003c/a>：語音測試；\u003ca href=\"https://openstax.org/books/university-physics-volume-1/pages/16-5-interference-of-waves\">S06\u003c/a>：聲音與聽覺。舊 \u003ca href=\"https://www.sony.co.uk/electronics/support/wireless-headphones-bluetooth-headphones/mdr-zx770bn/articles/00256977\">S03\u003c/a> 本輪讀取失敗，不作本頁查核依據。\u003c/p>\n\u003cp>前往 \u003ca href=\"#wiki-5\">measurement\u003c/a>。待研究：不同語音頻帶對辨識的貢獻、可懂度指標及有控制組的聽者實驗。\u003c/p>", "\u003ch3>先從一個熟悉的例子開始\u003c/h3>\n\u003cp>假設朋友說一款耳機「降噪很好」，你想知道是怎麼比的。第一件事是選一種固定聲音當例子，例如用喇叭播放同一段風扇錄音。接著固定喇叭、耳機和收聲位置，才能比較不同戴法或開關。後文的\u003cstrong>聲場\u003c/strong>是指一片空間裡各位置的聲音情況。同一個房間，靠近喇叭和坐在角落的聲音也會不同。\u003c/p>\n\u003cp>\u003cstrong>分貝\u003c/strong>寫成 dB，是表示聲音等級或比較聲音差值的刻度。暫時只用到「在相同基準下相減」這個動作。若你第一次接觸分貝，可先跳到下面的三頻率算例，再回頭讀換算。\u003c/p>\n\u003cp>\u003cstrong>頻率曲線\u003c/strong>就是一張圖。橫軸把頻率從低到高排開，縱軸告訴你各頻率減弱多少。想知道 100 Hz 的值，先在橫軸找到 100 Hz，再找到同一位置的線，最後往縱軸讀數字。下文的測試表格正是可以拿來畫曲線的幾個點。\u003c/p>\n\u003ch3>核心概念\u003c/h3>\n\u003cp>在可比較聲場中記錄裸耳、戴好但 ANC 關閉、戴好且 ANC 開啟的結果，再依頻率比較。裸耳到開啟包含整體隔音；相同佩戴下的開關差異，才是這次啟用 ANC 帶來的額外效果。\u003c/p>\n\u003ch3>適用條件與推導\u003c/h3>\n\u003cp>固定聲源、位置、音量、佩戴、設備及分析方法。分貝算例使用同一頻帶、同一參考與相同 RMS 定義；所有數字都是教學假設，並非本專案實測。量測與主觀聽感分開報告。\u003c/p>\n\u003ch3>為什麼需要三種狀態？\u003c/h3>\n\u003cp>只比沒有耳機與開啟 ANC，不能拆開物理結構及電子控制的效果。\u003ca href=\"https://www.rtings.com/headphones/tests/isolation\">S05\u003c/a> 的 Full Range 方法先測無耳機基準，再測佩戴後的關閉及開啟狀態。\u003c/p>\n\u003cp>用 L_bare(f)、L_off(f)、L_on(f) 表示同一頻率聲壓級。本頁定義正衰減代表變小：\u003c/p>\n\u003cpre style=\"overflow:auto\">\u003ccode>關閉時的整體隔音 = L_bare(f) − L_off(f)\n開啟時的整體隔音 = L_bare(f) − L_on(f)\nANC 額外差異 = L_off(f) − L_on(f)\u003c/code>\u003c/pre>\n\u003cp>這些是特定狀態的比較，不是可脫離耳機結構獨立存在的常數。別的圖若畫「殘餘相對基準」，變小可能用負值；先確認符號，不能只背「數字越大越好」。\u003c/p>\n\u003ch3>分貝不是百分比\u003c/h3>\n\u003cp>接下來要比較起伏程度，就需要先把一串有正有負的壓力變化濃縮成一個大小。做法是先把每個讀數平方，取平均，再開平方根。這叫\u003cstrong>均方根\u003c/strong>，簡寫 \u003cstrong>RMS\u003c/strong>。這樣波峰與波谷都會計入，而直接取平均可能讓正負讀數加成零。\u003c/p>\n\u003cp>假設某個短片段只有兩個簡化的讀數 +2 和 −2。平均是零，但各自平方都是 4，平均後開根號得到 2。RMS 保留了「一直有起伏」這項資訊。下表的聲壓比就是用這類大小比較。\u003c/p>\n\u003cp>\u003ca href=\"https://openstax.org/books/university-physics-volume-1/pages/16-5-interference-of-waves\">S06 §17.3\u003c/a> 給出聲強與壓力平方關係，以及聲強級差 \u003ccode>10 log10(I2/I1)\u003c/code>。對相同介質的對應聲壓比，可推得 \u003ccode>20 log10(p2/p1)\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>自行換算\u003c/strong>：若正衰減 A_dB = 20 log10(p_before/p_after)，則殘餘 RMS 聲壓比為 \u003ccode>10^(−A_dB/20)\u003c/code>：\u003c/p>\n\u003cdiv style=\"overflow:auto\">\u003ctable>\n\u003ctr>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">衰減量\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">殘餘 RMS 聲壓比\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">相應平方比\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">約 6.02 dB\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">0.50\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">0.25\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">10 dB\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">約 0.316\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">0.10\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">20 dB\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">0.10\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">0.01\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>「少 20 dB」不是少 20%，也不代表主觀音量剩 10%。平方比在適當傳播條件下對應聲強比；耳模內聲壓量測本身，不等於直接量出淨聲能流。分貝換算也不能取代人對音量的感受。\u003c/p>\n\u003cp>讀圖時可把同一分析條件下、開啟前的聲壓大小當成 100 格。少 20 dB 代表剩 10 格，少約 6 dB 代表剩約 50 格。這兩組格子呈現的是聲壓比。分貝以比例計算，所以少 20 dB 可以從 65 到 45，也可以從 60 到 40，換算出的前後聲壓比一樣。\u003c/p>\n\u003ch3>一張曲線，可以回答不同問題\u003c/h3>\n\u003cp>以下為\u003cstrong>自行設計數據\u003c/strong>，同一分析定義，單位 dB：\u003c/p>\n\u003cdiv style=\"overflow:auto\">\u003ctable>\n\u003ctr>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">頻率\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">裸耳\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">關閉\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">開啟\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">開啟整體隔音\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">ANC 額外差異\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">100 Hz\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">70\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">65\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">45\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">25\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">20\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">1000 Hz\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">70\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">55\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">50\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">20\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">5\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">4000 Hz\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">70\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">40\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">39\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">31\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">1\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>100 Hz 的開關差異最大，4000 Hz 的開啟整體隔音卻最大；兩句同時成立，因為指標不同。高頻 ANC 額外差異小，不代表高頻整體隔音差。\u003c/p>\n\u003cp>也不能隨便把三個頻率的 dB 平均，當作所有環境的效果。整體指標需說清楚頻帶、權重及算法；環境聲組成不同，相同曲線的意義也不同。\u003c/p>\n\u003ch3>實驗室測了什麼，又沒測什麼？\u003c/h3>\n\u003cp>S05 描述使用校準過的粉紅噪音（一種同時含有許多高低音的測試聲）、喇叭配置及耳模麥克風，用來觀察各頻率衰減。這種測試提供不同頻率的比較。若想看語音或飛機噪音的效果，則要另用情境錄音測試。粉紅噪音的特色見 \u003ca href=\"#wiki-8\">測試用的聲音\u003c/a>。\u003c/p>\n\u003cp>該測試者另有情境及語音項目。本專案只核讀公開方法，沒有取得原始測量檔或重現其設備；不能把方法介紹寫成本專案已完成的實驗。\u003c/p>\n\u003ch3>自己比較時，最容易踩哪些坑？\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>同時改變兩個條件\u003c/strong>：開關時重戴耳機或移動聲源，就無法只歸因於 ANC。固定條件並記錄例外。\u003c/li>\n\u003cli>\u003cstrong>只挑最好的一次\u003c/strong>：保留每次結果，分開同一佩戴的重複性與重戴變異。這是本專案建議，未冒充來源採用某個未核對的重複次數。\u003c/li>\n\u003cli>\u003cstrong>手機錄音直接報絕對 dB\u003c/strong>：未核對校準與自動增益，振幅不一定能作絕對聲壓級比較。先做定性示範，明示限制。\u003c/li>\n\u003cli>\u003cstrong>只報總分\u003c/strong>：讀者無法知道頻率差異，以及測試是否符合其使用情境。\u003c/li>\n\u003c/ol>\n\u003ch3>常見誤解與自我檢查\u003c/h3>\n\u003cul>\n\u003cli>裸耳 75、關閉 60、開啟 48 dB，ANC 額外差多少？\u003cstrong>12 dB；整體差異 27 dB。\u003c/strong>\u003c/li>\n\u003cli>某頻率開啟後從 50 升到 53 dB，本頁的額外差異多少？\u003cstrong>−3 dB，表示該次殘餘增加；應查條件與重複性，不能擅自改成零。\u003c/strong>\u003c/li>\n\u003cli>兩款都寫衰減 20 dB，就能說一樣？\u003cstrong>不能，還需頻帶、基準、權重與方法。\u003c/strong>\u003c/li>\n\u003cli>還聽得到人聲，表示零衰減？\u003cstrong>不是，見 \u003ca href=\"#wiki-3\">speech-residual\u003c/a>。\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003ch3>來源與延伸問題\u003c/h3>\n\u003cp>\u003ca href=\"https://www.rtings.com/headphones/tests/isolation\">S05\u003c/a>：三狀態與曲線、情境及語音方法；\u003ca href=\"https://openstax.org/books/university-physics-volume-1/pages/16-5-interference-of-waves\">S06\u003c/a>：聲強、壓力平方與分貝；\u003ca href=\"https://www.bose.com/stories/how-do-noise-cancelling-headphones-work\">S02\u003c/a>：貼合與主動／被動分工。\u003c/p>\n\u003cp>前往 \u003ca href=\"#wiki-2\">active-and-passive\u003c/a>。待研究：耳模與真人的差異、不確定度、頻帶加權及跨測試台比較；本頁未據此替任何產品排名。\u003c/p>", "\u003ch3>核心概念\u003c/h3>\n\u003cp>在 \u003ca href=\"#wiki-2\">耳機的兩條聲音路徑\u003c/a>，你看過外側麥克風先聽外界聲。現在想像再放一支麥克風到耳罩裡。外側聽到外面正在發生什麼，內側聽到兩道聲音在耳罩裡相加後還剩什麼。\u003c/p>\n\u003ch3>先看三種收音位置\u003c/h3>\n\u003cp>把耳罩想成一道門。門外是外界噪音，門內有喇叭和你的耳朵。用外側麥克風提供外界聲音的資訊，叫\u003cstrong>前饋\u003c/strong>。耳機根據這份資訊，決定喇叭怎麼播放補償聲。\u003c/p>\n\u003cp>\u003cstrong>回饋\u003c/strong>使用內側麥克風，收下耳罩裡的聲音，再把讀數送回電子元件，供它調整喇叭如何發聲。這形成「收聲 → 調整 → 再收聲」的一圈。麥克風也可能收進耳機本來播放的音樂，控制系統需要處理這層關係。\u003c/p>\n\u003cp>\u003cstrong>混合\u003c/strong>結合前饋及回饋，既有外側資訊，也有內側讀數。以典型位置示意，各欄是降噪用途，耳機上還可能有通話等用途的麥克風。位置和用途參考 \u003ca href=\"https://www.rtings.com/headphones/learn/research/noise-isolation\">S09\u003c/a>。\u003c/p>\n\u003ch3>內側麥克風離耳朵很近，差別在哪？\u003c/h3>\n\u003cp>回到 \u003ca href=\"#wiki-1\">同一時間、同一位置才相加\u003c/a>。麥克風和耳朵佔據不同位置，即使都在耳罩內，外界聲和補償聲走到兩處的路也可能不同。\u003c/p>\n\u003cp>想像兩個收聲點，一個貼在小喇叭旁邊，另一個在耳道入口。兩個點可能記到不同大小的變化。因此內側麥克風提供的是它所在位置的讀數。若要了解佩戴者耳邊的效果，量測位置也要跟著說清楚。作者摘要以假人頭部的耳位檢查這個問題。 \u003ca href=\"https://doi.org/10.3390/app12030977\">S08\u003c/a>\u003c/p>\n\u003ch3>一次研究怎麼比較三種架構？\u003c/h3>\n\u003cp>Wu 等人在同一款研究耳機上比較三種架構，並在消音室測試。消音室是一種盡量減少反射聲的房間。公開摘要報告，該配置下前饋對聲音來向較敏感，混合有助於緩解這點，且在該實驗中的表現最好。研究範圍是這組設備、參數和條件。市售耳機還得看實際設計與比較測試。 \u003ca href=\"https://opus.lib.uts.edu.au/handle/10453/101907\">S07\u003c/a>\u003c/p>\n\u003ch3>自我檢查\u003c/h3>\n\u003col>\n\u003cli>想先取得耳罩外的聲音資訊，在哪裡放麥克風？\u003cstrong>外側。\u003c/strong>\u003c/li>\n\u003cli>內側麥克風收音很小，能直接報成耳道入口測量嗎？\u003cstrong>先確認測點。它記的是所在位置的聲音。\u003c/strong>\u003c/li>\n\u003cli>要比較兩款耳機，可以只看「混合」標籤嗎？\u003cstrong>先看同條件測試。\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003ch3>來源與延伸問題\u003c/h3>\n\u003cp>\u003ca href=\"https://pubmed.ncbi.nlm.nih.gov/29604695/\">S04 前饋路徑\u003c/a> · \u003ca href=\"https://opus.lib.uts.edu.au/handle/10453/101907\">S07 架構比較摘要\u003c/a> · \u003ca href=\"https://doi.org/10.3390/app12030977\">S08 耳位研究摘要\u003c/a> · \u003ca href=\"https://www.rtings.com/headphones/learn/research/noise-isolation\">S09 典型收音位置\u003c/a>。\u003c/p>\n\u003cp>下一站 \u003ca href=\"#wiki-8\">為什麼用風扇、錄音及風分開測試\u003c/a>。\u003c/p>", "\u003ch3>核心概念\u003c/h3>\n\u003cp>回想 \u003ca href=\"#wiki-5\">三種狀態的比較\u003c/a>。即使關閉和開啟的條件一樣，測試者還得決定：播什麼聲音、從哪一刻讀數字，以及風吹過耳罩時要不要另測。\u003c/p>\n\u003cp>\u003cstrong>RTINGS\u003c/strong> 是做產品測試與評測的網站。他們實際測量耳機，並公開自己怎麼測。這裡引用的是他們的耳機測法案例。 \u003ca href=\"https://www.rtings.com/headphones/tests/isolation\">S05\u003c/a>\u003c/p>\n\u003ch3>先等幾秒與看第一瞬間\u003c/h3>\n\u003cp>想像背景錄音突然開始播放。可以一開始就記，也可以先播放一段時間再記。前者觀察剛出現的聲音如何變化，後者比較經過一段時間後的結果。\u003c/p>\n\u003cp>RTINGS 在其 v1.7 全頻方法改用\u003cstrong>粉紅噪音\u003c/strong>，一種可以持續播放、同時含有許多高低音的測試聲。它的特點是把頻率按「翻一倍」分成一段一段後，每段分到的總能量一樣。例如 100 到 200 Hz 和 200 到 400 Hz 都是從起點翻一倍，兩段的總能量相同。測試者可以播放同一種聲音，再分段比較耳機讓哪些頻率變小。RTINGS 在這個版本先播放五秒再記錄，讓部分耳機有時間調整。 \u003ca href=\"https://www.rtings.com/headphones/learn/research/noise-isolation\">S09\u003c/a>\u003c/p>\n\u003cp>這裡的「等幾秒」是測試在記錄前留給耳機調整的時間。相位章說的「晚一毫秒」是在算同一輪聲波的補償聲錯開多少。兩種時間觀察的是不同步驟。\u003c/p>\n\u003ch3>全頻與生活錄音分別回答什麼？\u003c/h3>\n\u003cp>全頻測試像一張地圖，用同一套方法比較低到高的各處。生活錄音像挑一個情境走一遍，播放街道、辦公室或機艙的聲音，觀察耳機面對這段錄音的表現。RTINGS 把全頻與生活情境分開量測。 \u003ca href=\"https://www.rtings.com/headphones/tests/isolation\">S05\u003c/a> · \u003ca href=\"https://www.rtings.com/headphones/learn/research/noise-isolation\">S09\u003c/a>\u003c/p>\n\u003cp>若要判斷自己的通勤情境，可以先看全頻圖了解哪個範圍衰減較多，再找情境比較觀察變動的聲音。不同測法回答的問題要各自寫清楚。\u003c/p>\n\u003ch3>為什麼風吹到麥克風要另測？\u003c/h3>\n\u003cp>遠處風吹樹葉，聲音從樹的位置傳過來。風吹到耳罩外的麥克風時，氣流也可能在收音位置附近直接造成壓力起伏。這兩種來源不一樣。\u003c/p>\n\u003cp>當外側麥克風收到局部氣流造成的起伏，耳機可能把它當成要補償的聲音。某些情況下，開啟降噪反而可能聽到額外的低沉風聲。不同產品和模式的結果要實測。RTINGS 用風扇與不同來風角度做專門測試。 \u003ca href=\"https://www.rtings.com/headphones/tests/isolation\">S05\u003c/a> · \u003ca href=\"https://www.rtings.com/headphones/learn/research/noise-isolation\">S09\u003c/a>\u003c/p>\n\u003ch3>自我檢查\u003c/h3>\n\u003col>\n\u003cli>想知道聲音一冒出來就發生什麼，應該從哪一刻記？\u003cstrong>從開始播放的時刻記。\u003c/strong>\u003c/li>\n\u003cli>全頻圖與街道錄音各回答什麼？\u003cstrong>前者比較各頻率，後者比較指定情境。\u003c/strong>\u003c/li>\n\u003cli>想知道走路時風吹耳罩會怎樣，該看什麼？\u003cstrong>看有控制風速或風向的測試。\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003ch3>來源與延伸問題\u003c/h3>\n\u003cp>\u003ca href=\"https://www.rtings.com/headphones/tests/isolation\">S05 公開測試流程\u003c/a> · \u003ca href=\"https://www.rtings.com/headphones/learn/research/noise-isolation\">S09 測試方法開發紀錄\u003c/a>。要比較不同實驗室的結果，先核對測試聲、開始記錄的時間及測量位置。\u003c/p>", "\u003ch3>先從一個熟悉的例子開始\u003c/h3>\n\u003cp>想像桌上的風扇一直嗡嗡響。耳機戴好、音樂暫停。我們追蹤其中一小段聲音，看看相同的風扇聲怎麼沿兩條路抵達耳邊。這裡用\u003cstrong>外側收聲的數位前饋\u003c/strong>作例子，最後再加一種會用內側讀數來調整的設計。算例是假想讀數，可以用紙筆驗算。\u003c/p>\n\u003ch3>風扇聲怎麼變成可運算的數字？\u003c/h3>\n\u003cp>第一條路是風扇聲穿過耳罩與周圍的空間，直接抵達耳邊。在這段路上，耳罩已提供一部分被動隔音。第二條路從耳罩外側的\u003cstrong>參考麥克風\u003c/strong>開始。這支麥克風接收外界聲，輸出隨聲音變動的電訊號。\u003c/p>\n\u003cp>以類比麥克風配數位運算為例，輸入電路整理電訊號，再交給\u003cstrong>類比轉數位電路（ADC）\u003c/strong>。它隔很短且固定的時間記下一個數字。每個數字叫一筆\u003cstrong>樣本\u003c/strong>，像連續為變動的電訊號拍照。數位訊號處理器（DSP）接手這串數字，依序計算要送往耳機喇叭的控制訊號。硬體功能可以整合在同一顆晶片。 \u003ca href=\"https://www.analog.com/en/products/adau1772.html\">S10\u003c/a> · \u003ca href=\"https://www.ti.com/lit/an/spra042/spra042.pdf\">S11\u003c/a>\u003c/p>\n\u003ch3>運算完，數字怎麼變回空氣中的聲音？\u003c/h3>\n\u003cp>\u003cstrong>數位轉類比電路（DAC）\u003c/strong>把控制數字轉成會變動的電訊號。\u003cstrong>功率放大電路\u003c/strong>提供帶動喇叭所需的電力，小喇叭的薄膜因此來回移動，推動空氣，形成\u003cstrong>補償聲\u003c/strong>。補償聲離開喇叭後，還要經過耳罩內的空間，才會在耳邊與外界聲相加。\u003c/p>\n\u003cpre style=\"overflow:auto\">\u003ccode>風扇 ──穿過耳罩等路徑─────────────────→ 耳邊外界聲 ┐\n風扇 → 外側麥克風 → ADC → DSP → DAC → 放大 → 喇叭 → 耳邊補償聲 ┴→ 兩道聲音相加\u003c/code>\u003c/pre>\n\u003cp>讀圖先追上排外界聲，再追下排控制路。麥克風讀的是收音位置，喇叭控制數字也只是播放前的數字。耳邊真正加總的是兩道已經傳到該位置的空氣壓力變化。 \u003ca href=\"https://pubmed.ncbi.nlm.nih.gov/29604695/\">S04\u003c/a> · \u003ca href=\"https://www.analog.com/en/products/adau1772.html\">S10\u003c/a> · \u003ca href=\"https://www.ti.com/lit/an/spra042/spra042.pdf\">S11\u003c/a>\u003c/p>\n\u003ch3>先量播放路徑：0.4 怎麼來？\u003c/h3>\n\u003cp>把已知測試訊號送進耳機小喇叭，風扇先停，避免它混進讀數。把測量麥克風放在要檢查的位置，同步記錄播放指令與收到的聲音。這組「送出 → 收到」資料描述的是\u003cstrong>次級路徑\u003c/strong>，包含輸出電路、喇叭、空間，以及測量麥克風與它的輸入電路。測點可以設在耳罩內，研究也會在耳膜位置另設測點。選哪一點，就要用那一點的讀數求解。 \u003ca href=\"https://doi.org/10.3390/app12030977\">S08\u003c/a> · \u003ca href=\"https://www.ti.com/lit/an/spra042/spra042.pdf\">S11\u003c/a> · \u003ca href=\"https://pub.dega-akustik.de/ICA2019/data/articles/000741.pdf\">S12\u003c/a>\u003c/p>\n\u003cp>\u003cstrong>課堂假想量測。\u003c/strong> 在選定的頻率和對齊的時刻，播放的大小讀數是 10，測點收到的大小讀數是 4。沿用同一組數字刻度，模型的比例就是 4 ÷ 10＝\u003cstrong>0.4\u003c/strong>。另記到達有多晚。後面的手算先把時間對好，並只留一個比例，所以可把播放指令乘 0.4。這個比例依教學刻度、測點和條件而變。單用 0.4 無法描述一整條真實路徑。\u003c/p>\n\u003cp>\u003cstrong>實際研究怎麼測。\u003c/strong> RWTH 團隊用 Bose QC20 耳機硬體和外接設備，播放從低音逐步變高的\u003cstrong>掃頻\u003c/strong>。一組測試聲長 \u003cstrong>4.05 秒\u003c/strong>，以 \u003cstrong>48 kHz（每秒 48,000 筆）\u003c/strong>記錄。對每個能可靠測到的頻率，拿收到的成分和送出的成分做比例比較，連同到達的相位一起記下。也可用一串隨時間排列的數字描述同一路徑，表示一次短促輸入之後每一刻會收到多少。研究者繞開 Bose 的原廠 ANC 電路，公開的是量到的聲音路徑。 \u003ca href=\"https://pub.dega-akustik.de/ICA2019/data/articles/000741.pdf\">S12\u003c/a>\u003c/p>\n\u003ch3>DSP 的兩個權重怎麼求？怎麼用它算播放指令？\u003c/h3>\n\u003cp>在一種常見的數位做法中，DSP 保留當下和最近幾筆收音，把每筆乘上各自的\u003cstrong>權重\u003c/strong>再相加。權重就是這筆數字要放大、縮小或翻轉多少。這種只用有限幾筆資料的做法叫 \u003cstrong>FIR 濾波器\u003c/strong>。每收到一筆新資料，整組計算向前移一格。改變各筆權重，會改變整串的形狀與時間關係。\u003c/p>\n\u003cp>\u003cstrong>先從校準資料找權重。\u003c/strong> 停掉耳機補償，重新啟動同一台風扇，在相同戴法下同步記外側麥克風與目標測點。外側樣本提供線索，目標測點告訴工程師還有多少風扇聲要壓低。下面是兩個時刻的假想讀數，沿用已量好並在時間上對齊的 0.4 模型。\u003c/p>\n\u003cdiv style=\"overflow:auto\">\u003ctable>\n\u003ctr>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">時刻\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">外側現在\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">外側前一筆\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">補償關閉時，測點的風扇聲\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">想在測點加進\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">反推要送給喇叭\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">A\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">+4\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">+2\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">+1.0\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">−1.0\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">−1.0 ÷ 0.4＝−2.5\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">B\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">+2\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">+4\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">+0.8\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">−0.8\u003c/td>\u003ctd style=\"padding:6px;border-bottom:1px solid #ccc\">−0.8 ÷ 0.4＝−2.0\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>用同一對權重填進兩列。令 a 為現在樣本的權重、b 為前一筆的權重。A 要求 4a＋2b＝−2.5，B 要求 2a＋4b＝−2.0。把 B 乘以二，再減 A，得到 6b＝−1.5，所以 b＝−0.25。代回 A 就得到 a＝−0.5。用兩列是因為只看 A，會有很多對權重都能算出 −2.5。\u003c/p>\n\u003cp>\u003cstrong>再把求到的權重用於播放。\u003c/strong> A 時刻做兩次乘法，再相加：\u003c/p>\n\u003cpre style=\"overflow:auto\">\u003ccode>現在：+4 × (−0.5)  = −2\n前一筆：+2 × (−0.25) = −0.5\n喇叭控制值：−2 + (−0.5) = −2.5\u003c/code>\u003c/pre>\n\u003cp>這一步得到的是\u003cstrong>播放指令 −2.5\u003c/strong>。實務通常用多筆數據、不同測試聲與戴法，為許多權重一起求解。先預測每組權重經實測路徑後留下的聲音，再找一組讓整段剩餘聲的能量較低的權重，並考慮穩定性等限制。Rivera Benois 等人的固定前饋研究用實測路徑做模擬，求一組 \u003cstrong>512 個控制權重\u003c/strong>，並比較用多次戴入的資料求解。在固定濾波器的例子中，播放時沿用那組權重。上面兩列是能手算的教學模型。 \u003ca href=\"https://www.ti.com/lit/an/spra042/spra042.pdf\">S11\u003c/a> · \u003ca href=\"https://arxiv.org/abs/2105.06894\">S13\u003c/a>\u003c/p>\n\u003ch3>為什麼不能直接把外側收音乘 −1？\u003c/h3>\n\u003cp>兩道聲音走的路不同。\u003cstrong>主路徑\u003c/strong>描述外界噪音往目標位置傳的變化。\u003cstrong>次級路徑\u003c/strong>描述電子播放指令一路經過輸出電路、喇叭和空間，到測點的變化。做自動調整時，模型還能包含測點的麥克風與輸入電路。播放路徑會改變大小和到達時機，所以只能在同一測點、同一時刻比較。\u003c/p>\n\u003cp>接上上一節的 −2.5。假設某時刻耳邊的原聲是 +1，播放指令準時到達，途中大小變成 0.4 倍。−2.5 最後是 −1，所以 +1 加 −1 剩 0。如果直接把外側的 +4 翻成 −4，路徑仍乘 0.4，耳邊會收到 −1.6，兩道聲音相加後剩 −0.6。負號表示相對平常壓力偏低，起伏仍在。若 −2.5 晚一格，原本應該抵消 +1 的時刻就對不上。這些數字是同一標度下的教學讀數。實際路徑在不同頻率可能有不同反應。\u003c/p>\n\u003cp>如果外側收音提供的提早量不夠，運算、轉換和播放來不及發出合適的補償，對突發且不可預知的聲音尤其難做。Bai 等人的研究摘要也指出兩路的相對延遲很重要。 \u003ca href=\"https://pubmed.ncbi.nlm.nih.gov/29604695/\">S04\u003c/a> · \u003ca href=\"https://www.ti.com/lit/an/spra042/spra042.pdf\">S11\u003c/a>\u003c/p>\n\u003ch3>內側麥克風怎麼幫忙調整下一次？\u003c/h3>\n\u003cp>某些前饋實作使用內側的\u003cstrong>誤差麥克風\u003c/strong>記錄相加後的剩餘聲。外側收音仍是產生補償聲的依據，內側讀數則用來調整權重。測點與耳道入口可能不同，參見 \u003ca href=\"#wiki-7\">兩個收音位置的差別\u003c/a>。固定權重的前饋和會調整權重的前饋皆可存在。\u003c/p>\n\u003cp>一種方法叫 \u003cstrong>Filtered-x LMS（FxLMS）\u003c/strong>。先用預估的播放路徑修正一份外側資料，表示「改變這些權重，測點會怎麼跟著變」。再把這份修正過的資料和實際量到的剩餘量一起拿來微調權重。它的目標是讓一段時間內剩餘聲的平方平均變小。用平方能同時計入偏高和偏低的起伏。播放指令仍用原本的外側樣本與控制權重來算。\u003c/p>\n\u003cp>\u003cstrong>播放路徑怎麼估？\u003c/strong> TI 的工程例子先在準備階段用喇叭播放一串已知數字對應的測試聲，再量內側麥克風收到的變化。把「送出去的訊號」和「量到的反應」配對，就有資料估計大小與到達時間。這是該例子的量測方法。戴法或耳罩密合改變時，原來的模型可能和目前的路徑有落差。 \u003ca href=\"https://www.ti.com/lit/an/spra042/spra042.pdf\">S11\u003c/a> · \u003ca href=\"https://doi.org/10.3390/app12030977\">S08\u003c/a>\u003c/p>\n\u003cpre style=\"overflow:auto\">\u003ccode>新權重 = 舊權重 − 步長 × 剩餘量 × 經路徑修正的對應樣本\u003c/code>\u003c/pre>\n\u003cp>步長代表一次改多少。用同一台風扇、同一對已求出的權重來走一次。假設重新戴了一次後，播放路徑較弱。同樣的測試讀數 10 現在量到 3.2，所以模型用 0.32。這裡假設新估計已取得、時刻依然對齊、原聲讀數仍為 +1，以單獨看播放路徑改變的影響。會不會重新量、何時更新路徑模型，依設計而定。\u003c/p>\n\u003cp>舊權重仍送出 −2.5，新路徑讓測點收到 −0.8，內側量到的剩餘為 +0.2。用 0.32 修正外側兩筆資料，得到 4 × 0.32＝1.28、2 × 0.32＝0.64。步長取 0.1，兩個權重就各改一次：\u003c/p>\n\u003cul>\n\u003cli>現在的權重：−0.5 − 0.1 × 0.2 × 1.28＝\u003cstrong>−0.5256\u003c/strong>。\u003c/li>\n\u003cli>前一筆的權重：−0.25 − 0.1 × 0.2 × 0.64＝\u003cstrong>−0.2628\u003c/strong>。\u003c/li>\n\u003cli>若再拿同樣的兩筆外側讀數與同樣的原聲條件做對照，新播放指令為 −2.628。乘 0.32 後加回 +1，剩 \u003cstrong>+0.15904\u003c/strong>，比 +0.2 小。\u003c/li>\n\u003c/ul>\n\u003cp>這是一次示意更新，後一個讀數是假設相同輸入的試算，實際下一刻會有新的麥克風讀數。步長 0.1 也是教學設定，估錯路徑或每次改太多都可能讓結果變差。Bai 等人的耳機研究摘要比較固定和自動調整的控制器。TI 手冊寫出 FxLMS 更新公式；每款產品採用的策略須另外查證。 \u003ca href=\"https://pubmed.ncbi.nlm.nih.gov/29604695/\">S04\u003c/a> · \u003ca href=\"https://www.ti.com/lit/an/spra042/spra042.pdf\">S11\u003c/a>\u003c/p>\n\u003ch3>自我檢查\u003c/h3>\n\u003col>\n\u003cli>ADC 前後的資料差在哪？\u003cstrong>前面是變動的電訊號，後面是一筆筆數字。\u003c/strong>\u003c/li>\n\u003cli>算出 −2.5 時，為什麼不能直接與耳邊的 +1 相加？\u003cstrong>要先經過播放路徑，對到相同時刻與位置。\u003c/strong>\u003c/li>\n\u003cli>內側麥克風量到剩餘聲之後，哪個東西被微調？\u003cstrong>控制濾波器的權重。\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003ch3>來源與延伸問題\u003c/h3>\n\u003cp>\u003ca href=\"https://pubmed.ncbi.nlm.nih.gov/29604695/\">S04 耳機前饋研究摘要\u003c/a> · \u003ca href=\"https://doi.org/10.3390/app12030977\">S08 測點差異\u003c/a> · \u003ca href=\"https://www.analog.com/en/products/adau1772.html\">S10 音訊晶片原廠資料\u003c/a> · \u003ca href=\"https://www.ti.com/lit/an/spra042/spra042.pdf\">S11 乘加與權重更新\u003c/a> · \u003ca href=\"https://pub.dega-akustik.de/ICA2019/data/articles/000741.pdf\">S12 耳機路徑實測\u003c/a> · \u003ca href=\"https://arxiv.org/abs/2105.06894\">S13 固定權重設計\u003c/a>。公開研究可用來說明量測、求解與更新的做法。課堂算例是自行設計，特定市售產品的原廠參數須另有公開證據。\u003c/p>"];
const slides=[["先看你的耳機", "把耳機戴上，想像你在聽歌，旁邊同時有人說話。歌和旁人的聲音分別從哪裡來？", "\n\u003ch2>兩條路都通到耳朵\u003c/h2>\n\u003cfigure class=\"teaching\">\u003cdiv class=\"path\">\u003cspan>手機裡的音樂\u003c/span>\u003cb aria-hidden=\"true\">→\u003c/b>\u003cspan>耳機的小喇叭\u003c/span>\u003cb aria-hidden=\"true\">→\u003c/b>\u003cspan>耳朵\u003c/span>\u003c/div>\u003cdiv class=\"path\">\u003cspan>旁人說話\u003c/span>\u003cb aria-hidden=\"true\">→\u003c/b>\u003cspan>外面的空氣\u003c/span>\u003cb aria-hidden=\"true\">→\u003c/b>\u003cspan>耳朵\u003c/span>\u003c/div>\u003cfigcaption>每一排從左往右讀。按下暫停，只停掉上面那排的音樂。\u003c/figcaption>\u003c/figure>\n\u003col>\u003cli>音樂由手機交給耳機，由耳機裡的小喇叭播放。\u003c/li>\u003cli>旁人的聲音在空氣中傳過來。即使按下暫停，這條路仍然存在。\u003c/li>\u003c/ol>\n\u003cp>耳機的小喇叭有一片快速來回動的薄膜。它推動空氣，空氣的變化傳到耳朵，你就聽到音樂。\u003c/p>\n\u003cdetails>\u003csummary>暫停音樂後，哪一路還能聽見？\u003c/summary>旁人的聲音還能從外面傳到耳朵。\u003c/details>\n", [6]], ["戴上耳機，和打開降噪，是兩個動作", "想像你在有風扇的房間。你可以在同一位置，依序比較三次。", "\n\u003col>\u003cli>先不戴耳機，聽風扇聲。\u003c/li>\u003cli>戴好耳機，關閉降噪，再聽一次。\u003c/li>\u003cli>維持原本戴法，打開降噪，繼續聽。全程暫停音樂。\u003c/li>\u003c/ol>\n\u003cfigure class=\"teaching\">\u003cdiv class=\"cards\">\u003cdiv>\u003cstrong>① 不戴\u003c/strong>\u003cspan>直接聽風扇\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>② 戴好、關降噪\u003c/strong>\u003cspan>多了耳罩的阻隔\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>③ 戴好、開降噪\u003c/strong>\u003cspan>再加電子降噪\u003c/span>\u003c/div>\u003c/div>\u003cfigcaption>① 比 ② 看戴上的差異。② 比 ③ 時維持原本戴法，只切換開關。\u003c/figcaption>\u003c/figure>\n\u003cp>第 1 到第 2 次，耳罩的軟墊或耳塞多擋住一部分外界聲音。這叫\u003cstrong>被動隔音\u003c/strong>。第 2 到第 3 次啟動電子功能，這叫\u003cstrong>主動降噪\u003c/strong>。英文 Active Noise Cancellation 常縮寫為 \u003cstrong>ANC\u003c/strong>。\u003c/p>\n\u003cdetails>\u003csummary>哪兩次能比較電子功能的效果？\u003c/summary>第 2 與第 3 次。耳機都戴在原本的位置，變動的是降噪開關。\u003c/details>\n", [6, 2]], ["聲音怎麼從喇叭傳到耳朵？", "把小喇叭想成一片快速來回動的薄膜。它往前推時，附近空氣被擠得密一點。往後動時，附近空氣又疏一點。", "\n\u003cp>一陣比較密、比較疏的變化能向外傳。\u003cstrong>聲波\u003c/strong>就是傳出去的這種變化。耳邊的空氣一擠一鬆，我們可以記錄它比平常的壓力高多少或低多少，這叫\u003cstrong>聲壓變化\u003c/strong>。\u003c/p>\n\u003cp>畫成圖時，橫向表示時間由左到右。中線表示平常的壓力。圖線在中線上方表示當下多擠一點，在下方表示當下少擠一點。\u003c/p>\n\u003cfigure class=\"teaching\">\u003cdiv class=\"cards\">\u003cdiv>\u003cstrong>① 空氣擠一點\u003c/strong>\u003cspan>比平常的壓力高\u003c/span>\u003cb class=\"level high\">＋\u003c/b>\u003c/div>\u003cdiv>\u003cstrong>② 回到平常\u003c/strong>\u003cspan>與平常的壓力相同\u003c/span>\u003cb class=\"level\">0\u003c/b>\u003c/div>\u003cdiv>\u003cstrong>③ 空氣鬆一點\u003c/strong>\u003cspan>比平常的壓力低\u003c/span>\u003cb class=\"level low\">−\u003c/b>\u003c/div>\u003c/div>\u003cfigcaption>這三格依序記下耳邊的變化。下一頁把更多時刻連成一條線，叫做波形。\u003c/figcaption>\u003c/figure>\n\u003cdetails>\u003csummary>線在中線下方代表什麼？\u003c/summary>代表壓力比平常低一點。空氣仍然有壓力。\u003c/details>\n", [1, 6]], ["看懂波形，先抓住快慢和大小", "波形是把耳邊的變化一刻一刻畫下來。用固定重複的聲音練習，先看它多久重複，再看它偏離中線多遠。", "\n\u003cfigure class=\"teaching\">\u003cdiv class=\"wave-examples\">\n\u003cdiv>\u003cstrong>A　原來的波\u003c/strong>\u003ccanvas width=\"300\" height=\"93\" data-cycles=\"2\" data-height=\"21\" aria-label=\"兩輪起伏，每輪同樣高\">\u003c/canvas>\u003c/div>\n\u003cdiv>\u003cstrong>B　同樣高，重複更快\u003c/strong>\u003ccanvas width=\"300\" height=\"93\" data-cycles=\"4\" data-height=\"21\" aria-label=\"同一段時間內出現四輪，和 A 同高\">\u003c/canvas>\u003c/div>\n\u003cdiv>\u003cstrong>C　重複一樣快，起伏更大\u003c/strong>\u003ccanvas width=\"300\" height=\"93\" data-cycles=\"2\" data-height=\"33\" aria-label=\"同一段時間內出現兩輪，比 A 高\">\u003c/canvas>\u003c/div>\n\u003c/div>\u003cfigcaption>三張圖的左右長度代表同一段時間，上下也使用同一把尺。虛線是平常的壓力。\u003c/figcaption>\u003c/figure>\n\u003col>\u003cli>\u003cstrong>先從左往右數波峰。\u003c/strong> A 有兩個，B 有四個。在同一段時間內，B 重複得更快。每秒重複的次數叫\u003cstrong>頻率\u003c/strong>。每秒 100 次寫成 100 Hz，讀作 100 赫茲。\u003c/li>\n\u003cli>\u003cstrong>再從一個波峰移到下一個波峰。\u003c/strong> 這段間隔是一輪所花的時間，叫\u003cstrong>週期\u003c/strong>。每秒 100 次，一輪就是 1/100 秒，也就是 10 毫秒。一毫秒是千分之一秒。\u003c/li>\n\u003cli>\u003cstrong>最後從虛線往上比高度。\u003c/strong> A 和 C 都有兩個波峰，但 C 的波峰離虛線更遠。離中線最遠的距離叫\u003cstrong>振幅\u003c/strong>。\u003c/li>\u003c/ol>\n\u003cdetails>\u003csummary>一張圖的波峰更高，能說它重複得更快嗎？\u003c/summary>只看高度能比較振幅。要比較頻率，得看同一段時間內重複幾次。\u003c/details>\n", [1, 4]], ["兩道聲音相遇，先算一個時刻", "在耳邊的同一個位置，如果兩道聲音同時到達，可以把它們在那一刻造成的壓力變化相加。這叫疊加。", "\n\u003cfigure class=\"teaching\">\u003cdiv class=\"equations\">\n\u003cdiv>\u003cspan class=\"high\">＋1 ↑\u003c/span>\u003cb>＋\u003c/b>\u003cspan class=\"high\">＋1 ↑\u003c/span>\u003cb>＝\u003c/b>\u003cstrong class=\"high\">＋2 ↑\u003c/strong>\u003c/div>\n\u003cdiv>\u003cspan class=\"high\">＋1 ↑\u003c/span>\u003cb>＋\u003c/b>\u003cspan class=\"low\">−1 ↓\u003c/span>\u003cb>＝\u003c/b>\u003cstrong>0\u003c/strong>\u003c/div>\n\u003cdiv>\u003cspan class=\"high\">＋1 ↑\u003c/span>\u003cb>＋\u003c/b>\u003cspan class=\"low\">−0.8 ↓\u003c/span>\u003cb>＝\u003c/b>\u003cstrong class=\"high\">＋0.2 ↑\u003c/strong>\u003c/div>\n\u003c/div>\u003cfigcaption>每排只看一個瞬間。↑ 表示壓力比平常高，↓ 表示比平常低。\u003c/figcaption>\u003c/figure>\n\u003cp>先看第二排。第一道讓壓力高 1，第二道讓它低 1，加起來剛好回到平常，這叫\u003cstrong>抵消\u003c/strong>。再看第三排，第二道少降一點，就留下 0.2。要讓一整段聲音變小，這種配合要延續到後面的時刻。\u003c/p>\n\u003cdetails>\u003csummary>剛好抵消一個時刻，夠不夠？\u003c/summary>還要看後面的每個時刻。如果下一刻兩道都讓壓力升高，結果就會增加。\u003c/details>\n", [1]], ["動手試出怎樣才會抵消", "上一頁只算了一個時刻。現在把兩道波分成上下兩排，再把加出來的結果放在第三排。每排都從左往右看時間。", "\n\u003cfigure class=\"teaching\">\u003ccanvas id=\"wave\" width=\"520\" height=\"290\" aria-label=\"第一道波、第二道波、兩者相加，各畫在一排\">\u003c/canvas>\u003cfigcaption>沿圖上的直線往下看，同一直線穿過的三排代表同一時刻。每排的虛線是自己的零線。\u003c/figcaption>\u003c/figure>\n\u003cp>用一整圈 360° 代表重複一輪。兩道波錯開多少叫\u003cstrong>相位差\u003c/strong>。0° 沒錯開，90° 錯開四分之一輪，180° 錯開半輪。\u003c/p>\n\u003cdiv class=\"row\" aria-label=\"直接嘗試三種位置\">\u003cbutton type=\"button\" data-phase=\"0\">0° 沒錯開\u003c/button>\u003cbutton type=\"button\" data-phase=\"90\">90° 四分之一輪\u003c/button>\u003cbutton type=\"button\" data-phase=\"180\">180° 半輪\u003c/button>\u003c/div>\n\u003clabel for=\"phase\">也可以拖動滑桿調整錯開量\u003c/label>\u003cbr>\u003cinput id=\"phase\" type=\"range\" min=\"0\" max=\"180\" value=\"0\">\u003cp id=\"result\" aria-live=\"polite\">\u003c/p>\n\u003col>\u003cli>點 0°，沿直線讀到「高＋高」，第三排的波峰變成兩倍高。\u003c/li>\u003cli>再點 180°，看同一條線變成「高＋低」，第三排變平。\u003c/li>\u003cli>點 90°，第三排還有起伏，表示還沒完全抵消。\u003c/li>\u003c/ol>\n\u003cp>這個練習使用兩道同樣高、重複得一樣快的波。下一頁來看耳機怎麼做出第二道聲音。\u003c/p>\n", [1, 4]], ["耳機怎麼做出抵消聲？", "有一種做法是把收聲用的麥克風放在耳機外側，先取得外界聲音的資訊。麥克風就像手機的錄音元件。", "\n\u003col>\u003cli>外界噪音一邊傳向耳朵，一邊被麥克風收進來。\u003c/li>\u003cli>耳機裡負責運算的電子元件根據收進來的資訊，決定小喇叭要怎麼動。\u003c/li>\u003cli>喇叭播放\u003cstrong>補償聲\u003c/strong>，也就是用來減少外界聲的另一道聲音。\u003c/li>\u003cli>兩道聲音抵達耳邊，在同一位置相加。對得越準，剩下的聲音才可能越小。\u003c/li>\u003c/ol>\n\u003cfigure class=\"teaching\">\u003cdiv class=\"path\">\u003cspan>外界噪音\u003c/span>\u003cb aria-hidden=\"true\">→\u003c/b>\u003cspan>直接傳過來\u003c/span>\u003cb aria-hidden=\"true\">→\u003c/b>\u003cspan>耳邊\u003c/span>\u003c/div>\u003cdiv class=\"path long-path\">\u003cspan>外界噪音\u003c/span>\u003cb aria-hidden=\"true\">→\u003c/b>\u003cspan>麥克風收聲\u003c/span>\u003cb aria-hidden=\"true\">→\u003c/b>\u003cspan>耳機運算\u003c/span>\u003cb aria-hidden=\"true\">→\u003c/b>\u003cspan>喇叭發出補償聲\u003c/span>\u003cb aria-hidden=\"true\">→\u003c/b>\u003cspan>耳邊\u003c/span>\u003c/div>\u003cfigcaption>先讀上排外界聲，再讀下排補償聲怎麼做出來。兩路都在耳邊相遇。\u003c/figcaption>\u003c/figure>\n\u003cp>收聲的位置離耳朵有一段距離。運算、喇叭發聲和空氣傳遞也需要時間。因此麥克風錄到的變化，還得配合抵達耳邊的時間與大小。這類用外側資訊預先補償的做法叫\u003cstrong>前饋\u003c/strong>。\u003c/p>\n\u003cdetails>\u003csummary>耳機應該在哪裡做到兩道聲音相加變小？\u003c/summary>目標是耳朵附近。麥克風收聲的位置只是提供資訊。\u003c/details>\n\u003cp>想跟著同一聲風扇聲看每個零件怎麼接手？\u003ca href=\"#17\">從第 17 頁開始看完整路徑和算例\u003c/a>。\u003c/p>\n", [2, 4]], ["晚一點點，為什麼也會有差？", "延遲就是晚到的時間。假設補償聲本來對準得剛剛好，現在額外晚到 1 毫秒。重複得越快，一毫秒就會佔一輪越大一段。", "\n\u003cfigure class=\"teaching\">\u003cdiv class=\"time-example\">\u003cstrong>100 Hz 的一輪有 10 格\u003c/strong>\u003cdiv class=\"time-grid ten\" aria-label=\"十格，第一格著色\">\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003c/div>\u003cstrong>500 Hz 的一輪只有 2 格\u003c/strong>\u003cdiv class=\"time-grid two\" aria-label=\"兩格，第一格著色\">\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003c/div>\u003c/div>\u003cfigcaption>每格都是 1 毫秒，兩排格子的寬度相同。看著色的一格佔整排多少，就知道晚到的時間佔一輪多少。\u003c/figcaption>\u003c/figure>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>重複速度\u003c/th>\u003cth>一輪多久\u003c/th>\u003cth>1 毫秒佔一輪多少\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>100 Hz\u003c/td>\u003ctd>10 毫秒\u003c/td>\u003ctd>十分之一\u003c/td>\u003c/tr>\u003ctr>\u003ctd>500 Hz\u003c/td>\u003ctd>2 毫秒\u003c/td>\u003ctd>一半\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003cp>如果本來是波峰對波谷，補償聲再晚半輪，波谷的位置就可能變成波峰。兩個一樣大的波反而會加在一起。\u003c/p>\n\u003cp>這是為了看清時間如何影響抵消的算例。要知道某一款耳機真的能減少多少，還要看它的實際測量。\u003c/p>\n\u003cdetails>\u003csummary>同樣晚 1 毫秒，哪一個例子錯開的輪數較多？\u003c/summary>500 Hz。一輪只要 2 毫秒，晚 1 毫秒就錯開半輪。\u003c/details>\n", [4]], ["為什麼還是聽得懂隔壁說話？", "說話時，每個字的聲音不一樣。一句話可能有較低的嗡嗡聲、較高的嘶聲，也有停頓。耳機可能讓其中一些部分變小，另一些仍清楚。", "\n\u003cp>想像你戴著耳機，房間的風扇一直開著，朋友在同一個位置說話。開啟降噪後，風扇小聲了，朋友也稍微小聲了，你卻仍然聽得懂。下面用同一句話比較開啟前後。\u003c/p>\n\u003cfigure class=\"teaching\">\u003cdiv class=\"cards\">\u003cdiv>\u003cstrong>開啟前\u003c/strong>\u003cspan>風扇嗡嗡聲明顯\u003c/span>\u003cspan>聽得懂「要喝水嗎？」\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>開啟後\u003c/strong>\u003cspan>風扇聲小很多\u003c/span>\u003cspan>人聲也小了，仍聽得懂那句話\u003c/span>\u003c/div>\u003c/div>\u003cfigcaption>這是可能出現的情境。先比較同一種聲音前後，再問句子能不能聽懂。\u003c/figcaption>\u003c/figure>\n\u003cp>要問\u003cstrong>人聲變小了多少\u003c/strong>，得比較開關前後的聲音。要問\u003cstrong>還能聽懂幾個字\u003c/strong>，得請人辨認說了什麼。這兩個問題需要不同的觀察。\u003c/p>\n\u003cdetails>\u003csummary>「我還聽得懂」可以告訴我們什麼？\u003c/summary>還留有足夠的線索讓你理解那句話。要知道減少多少，仍得量開關前後的差異。\u003c/details>\n", [3, 5]], ["怎麼公平地量出差異？", "如果關掉時耳罩戴得很鬆，打開時又戴緊了，你同時改了兩件事。重新比較時，應該只改想知道的那一件。", "\n\u003cp>先讓同一台喇叭在同一位置播放相同的測試聲。讓放在耳朵位置的麥克風記錄三次。第一個數字是沒有耳機的基準。第二、三個數字是同一戴法下關閉及開啟降噪。\u003c/p>\n\u003cp>\u003cstrong>分貝（dB）\u003c/strong>是記錄聲音等級的一種刻度。在這個例子中，數字較小表示測到較低的聲音等級。先用相減看少了幾分貝。\u003c/p>\n\u003cfigure class=\"teaching\">\u003cdiv class=\"cards\">\u003cdiv>\u003cstrong>① 不戴\u003c/strong>\u003cspan class=\"meter\">70 dB\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>② 戴好、關降噪\u003c/strong>\u003cspan class=\"meter\">60 dB\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>③ 戴好、開降噪\u003c/strong>\u003cspan class=\"meter\">45 dB\u003c/span>\u003c/div>\u003c/div>\u003cfigcaption>假設數字。先遮住 ①，只用 ② 和 ③ 算出開關差異。\u003c/figcaption>\u003c/figure>\n\u003cdetails>\u003csummary>開關的額外差異是 25 還是 15 dB？\u003c/summary>60 − 45 = 15 dB。70 − 45 = 25 dB 則包含戴耳機的物理阻隔。\u003c/details>\n", [2, 5]], ["頻率曲線到底在畫什麼？", "測量時，把低音到高音的各個頻率排成一列，再把每個頻率減少了多少寫在對應位置。把這些點畫成線，就是一條顯示不同頻率效果的曲線。", "\n\u003cp>先讀一份假設數據。第一欄是每秒重複幾次，第二欄是開啟降噪後額外少了幾分貝。\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>頻率\u003c/th>\u003cth>開關差異\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>100 Hz\u003c/td>\u003ctd>20 dB\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1,000 Hz\u003c/td>\u003ctd>5 dB\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4,000 Hz\u003c/td>\u003ctd>1 dB\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003cfigure class=\"teaching\">\u003ccanvas id=\"frequency-curve\" width=\"360\" height=\"245\" aria-label=\"橫軸是頻率。100 Hz 對應 20 dB，1000 Hz 對應 5 dB，4000 Hz 對應 1 dB。\">\u003c/canvas>\u003cfigcaption>先看圖下方的頻率，再沿橘色虛線往上找點，最後往左讀 20 dB。橘色虛線示範的是 100 Hz。\u003c/figcaption>\u003c/figure>\n\u003cp>沿下方找到 100 Hz，再往上找到線上的第一個點。從點的高度往左讀到 20 dB。點之間的線用來看出方向。讀其他曲線時也要先看基準，有些圖用裸耳當基準。\u003c/p>\n\u003cdetails>\u003csummary>哪個頻率在這組例子的開關差異最大？\u003c/summary>100 Hz。這張表只能回答表內三個測試點，以及這個比較基準的問題。\u003c/details>\n", [5]], ["麥克風放在哪裡，會聽到什麼？", "把耳罩想成一道門。門外是外界噪音，門內有小喇叭和你的耳朵。先看圖上亮色圓點在哪一側，再看名稱。", "\n\u003cfigure class=\"teaching\">\u003cdiv class=\"cards mic-cards\">\n\u003cdiv>\u003cstrong>前饋\u003c/strong>\u003cdiv class=\"mic-map\" aria-label=\"外側有降噪麥克風\">\u003cspan class=\"has-mic\">外側\u003c/span>\u003cspan>內側\u003c/span>\u003c/div>\u003cspan>先取得門外的聲音資訊，再決定怎麼發出補償聲。\u003c/span>\u003c/div>\n\u003cdiv>\u003cstrong>回饋\u003c/strong>\u003cdiv class=\"mic-map\" aria-label=\"內側有降噪麥克風\">\u003cspan>外側\u003c/span>\u003cspan class=\"has-mic\">內側\u003c/span>\u003c/div>\u003cspan>聽門內剩下什麼，將讀數送回去調整喇叭。\u003c/span>\u003c/div>\n\u003cdiv>\u003cstrong>混合\u003c/strong>\u003cdiv class=\"mic-map\" aria-label=\"內側及外側都有降噪麥克風\">\u003cspan class=\"has-mic\">外側\u003c/span>\u003cspan class=\"has-mic\">內側\u003c/span>\u003c/div>\u003cspan>同時使用門外的聲音資訊與門內的讀數。\u003c/span>\u003c/div>\n\u003c/div>\u003cfigcaption>亮點代表典型的降噪麥克風位置，中線是耳罩的分界。每張卡只畫降噪用途。\u003c/figcaption>\u003c/figure>\n\u003cp>回饋像一圈「收聲 → 調整 → 再收聲」。內側麥克風也可能收到耳機播放的音樂，電子系統要一併處理。\u003c/p>\n\u003cdetails>\u003csummary>想讓耳機知道耳罩裡還剩什麼聲音，應該在哪邊收聲？\u003c/summary>內側。若同時使用外側資訊，就是混合做法。\u003c/details>\n", [7]], ["耳罩裡兩個位置，會聽到一樣嗎？", "內側麥克風可能在小喇叭旁邊，你的耳道入口則在另一處。先找圖中的 A 和 B。", "\n\u003cfigure class=\"teaching\">\u003cdiv class=\"cards\">\u003cdiv>\u003cstrong>A　內側麥克風\u003c/strong>\u003cspan>可能靠近耳機的小喇叭\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>B　耳道入口\u003c/strong>\u003cspan>佩戴者耳邊的另一個位置\u003c/span>\u003c/div>\u003c/div>\u003cfigcaption>A 和 B 是兩個收聲位置。每處都是外界聲和補償聲相加後的結果，兩處的聲音走法和讀數可能不同。\u003c/figcaption>\u003c/figure>\n\u003cdiv class=\"research-note\">\u003cstrong>研究是怎麼比的？\u003c/strong>\u003cp>一組研究比較同一副研究耳機的三種架構，將測試放在盡量減少聲音反射的消音室。公開摘要報告，在那組條件下，前饋較受聲音來向影響，混合有助於減輕這項影響，且該次表現最好。\u003c/p>\u003cp>另一篇研究在假人頭部的耳位檢查讀數。想比較市售耳機時，應先確認測試條件和耳位結果。\u003c/p>\u003c/div>\n\u003cdetails>\u003csummary>只知道「麥克風 A 收到的聲音較小」，可以直接當成 B 的數字嗎？\u003c/summary>先確認測量位置。A 的讀數代表 A 所在處，想知道 B 要看耳位的量測。\u003c/details>\n", [7]], ["風聲是從樹那邊來，還是在耳機旁產生？", "想像你站在樹旁，先聽到遠處葉子沙沙響，接著感到風直接吹過耳罩。兩種情況值得分開看。", "\n\u003cfigure class=\"teaching\">\u003cdiv class=\"cards\">\u003cdiv>\u003cstrong>遠處的聲音\u003c/strong>\u003cspan>風推動樹葉 → 樹葉發聲 → 聲音傳到耳朵\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>耳罩旁的氣流\u003c/strong>\u003cspan>風掠過外側麥克風 → 收音點的壓力起伏 → 耳機可能把它當噪音補償\u003c/span>\u003c/div>\u003c/div>\u003cfigcaption>先比較聲音或壓力變化的起點。右欄的起伏就在收音位置附近。\u003c/figcaption>\u003c/figure>\n\u003cp>在某些設備和模式下，補償可能讓人聽到額外的低沉風聲。\u003cstrong>RTINGS\u003c/strong> 是做產品測試與評測的網站，會實際測量耳機並公開測法。他們用風扇從不同角度吹耳機，再比較風聲。要解讀結果，先確認測的是哪副耳機、哪個模式，以及風從哪裡吹來。\u003c/p>\n\u003cdetails>\u003csummary>想知道走路時風吹過耳罩怎樣，該找哪種測試？\u003c/summary>找有控制來風條件的風噪測試，再看你使用的模式是否在測試範圍內。\u003c/details>\n", [8]], ["測降噪，要從聲音一開始就記嗎？", "如果一段背景聲剛播出，你可以馬上記錄，也可以先讓耳機有時間調整。這兩個觀察時點回答不同問題。", "\n\u003cfigure class=\"teaching\">\u003cdiv class=\"path\">\u003cspan>\u003cstrong>0 秒\u003c/strong>\u003cbr>開始播測試聲\u003c/span>\u003cb aria-hidden=\"true\">→\u003c/b>\u003cspan>先讓耳機聽一段時間\u003c/span>\u003cb aria-hidden=\"true\">→\u003c/b>\u003cspan>\u003cstrong>5 秒後\u003c/strong>\u003cbr>開始記錄\u003c/span>\u003c/div>\u003cfigcaption>這是 RTINGS 的 v1.7 測法案例。沿箭頭讀，五秒是從開始播到開始記錄。\u003c/figcaption>\u003c/figure>\n\u003cp>\u003cstrong>粉紅噪音\u003c/strong>是一種可以持續播放、同時含有許多高低音的測試聲。它怎麼分配能量？把頻率按「翻一倍」分段，每段分到的總能量一樣。\u003c/p>\n\u003cdiv class=\"cards\">\u003cdiv>\u003cstrong>100 到 200 Hz\u003c/strong>\u003cspan>從 100 翻到兩倍\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>200 到 400 Hz\u003c/strong>\u003cspan>從 200 翻到兩倍\u003c/span>\u003c/div>\u003c/div>\n\u003cp>上面兩段的總能量相同。測試者播放同一種聲音，就能分段比較耳機讓哪些頻率變小。街道、辦公室或機艙錄音則用來看耳機遇到這些生活聲音時的表現。\u003c/p>\n\u003cp>第 8 頁的一毫秒用來計算一道波錯開多少。這裡的五秒是測試開始記錄前留給耳機調整的時間。\u003c/p>\n\u003cdetails>\u003csummary>想看一陣噪音剛出現時的效果，要從哪一刻記？\u003c/summary>從聲音出現時開始記，才能看到最初的變化。\u003c/details>\n", [8, 4]], ["少 20 dB，耳邊的聲壓剩下多少？", "第 11 頁的圖上讀到 20 dB。分貝用比例計算。先把開啟前的聲壓大小想成 100 格，再看看兩種差異各會剩幾格。", "\n\u003cfigure class=\"teaching\">\u003cdiv class=\"pressure-compare\">\u003cdiv>\u003cstrong>開啟前\u003c/strong>\u003cdiv class=\"pressure-bar\">\u003cspan style=\"--remain:100%\">\u003c/span>\u003c/div>\u003cspan>100 格\u003c/span>\u003c/div>\n\u003cdiv>\u003cstrong>少約 6 dB\u003c/strong>\u003cdiv class=\"pressure-bar\">\u003cspan style=\"--remain:50%\">\u003c/span>\u003c/div>\u003cspan>約 50 格\u003c/span>\u003c/div>\n\u003cdiv>\u003cstrong>少 20 dB\u003c/strong>\u003cdiv class=\"pressure-bar\">\u003cspan style=\"--remain:10%\">\u003c/span>\u003c/div>\u003cspan>10 格\u003c/span>\u003c/div>\u003c/div>\u003cfigcaption>每排最長都是 100 格。著色長度是同一量測條件下留下的聲壓比例。\u003c/figcaption>\u003c/figure>\n\u003cp>例如 65 降到 45 dB，差 20 dB。60 降到 40 dB 也是同樣的差。兩者換算後都剩開啟前聲壓的十分之一。感覺有多大聲，需要另外觀察。\u003c/p>\n\u003cdetails>\u003csummary>第 11 頁的 100 Hz 少 20 dB，這個條件下大約剩幾格？\u003c/summary>10 格。這是聲壓比，用來解讀指定的頻率與量測條件。\u003c/details>\n", [5]], ["跟著一聲風扇聲走進耳機", "戴好耳機，暫停音樂。追蹤風扇嗡聲中的一小段。先看它穿過耳罩的路，再看耳機如何沿另一條路做出補償聲。", "\n\u003cfigure class=\"teaching\">\n\u003cp>\u003cstrong>上路｜外界聲自己走\u003c/strong>\u003c/p>\n\u003cdiv class=\"path\">\u003cspan>風扇發聲\u003c/span>\u003cb aria-hidden=\"true\">→\u003c/b>\u003cspan>穿過耳罩等路徑\u003c/span>\u003cb aria-hidden=\"true\">→\u003c/b>\u003cspan>耳邊的原聲\u003c/span>\u003c/div>\n\u003cp>\u003cstrong>下路｜耳機用收音做出補償聲\u003c/strong>\u003c/p>\n\u003col class=\"signal-steps\">\n\u003cli>\u003cstrong>外側麥克風\u003c/strong>\u003cspan>風扇聲 → 會變動的電訊號\u003c/span>\u003c/li>\n\u003cli>\u003cstrong>類比轉數位電路（ADC）\u003c/strong>\u003cspan>隔固定時間記一筆數字，每筆叫樣本\u003c/span>\u003c/li>\n\u003cli>\u003cstrong>數位訊號處理器（DSP）\u003c/strong>\u003cspan>用目前和先前的數字算出播放指令\u003c/span>\u003c/li>\n\u003cli>\u003cstrong>數位轉類比電路（DAC）與功率放大\u003c/strong>\u003cspan>轉成電訊號，再提供帶動喇叭的電力\u003c/span>\u003c/li>\n\u003cli>\u003cstrong>小喇叭\u003c/strong>\u003cspan>薄膜來回推空氣，補償聲傳到耳邊\u003c/span>\u003c/li>\n\u003c/ol>\n\u003cfigcaption>先從上路左端追到耳邊，再按 1 到 5 走下路。到第 5 步才有空氣中的補償聲，兩路在耳邊相加。這是外側收音的數位前饋示意，幾種電子功能可以整合在同一顆晶片。\u003c/figcaption>\n\u003c/figure>\n\u003cdetails>\u003csummary>從哪一步開始，電訊號成為一筆筆數字？\u003c/summary>第 2 步。類比轉數位電路每隔固定時間記一次，後面的處理器才有數字可算。\u003c/details>\n", [9, 2]], ["先量耳機小喇叭：0.4 怎麼來？", "先把風扇停掉，只用耳機的小喇叭發出已知的測試聲。在要檢查的位置放一支麥克風，記下它收到什麼、晚了多久。", "\n\u003cfigure class=\"teaching\">\n\u003cdiv class=\"path\">\u003cspan>已知播放讀數 \u003cstrong>10\u003c/strong>\u003c/span>\u003cb aria-hidden=\"true\">→\u003c/b>\u003cspan>電路、喇叭、空間\u003c/span>\u003cb aria-hidden=\"true\">→\u003c/b>\u003cspan>測點收到 \u003cstrong>4\u003c/strong>\u003c/span>\u003c/div>\n\u003cfigcaption>課堂假想量測。先把時間對齊，只看一個頻率的大小。右邊 4 除以左邊 10，得到 \u003cstrong>0.4\u003c/strong>。到達時間另記。\u003c/figcaption>\n\u003c/figure>\n\u003cdiv class=\"research-note\">\u003cstrong>研究實際怎麼做？\u003c/strong>\u003cp>RWTH 團隊用 Bose QC20 耳機硬體和外接設備，播放從低音逐步變高的測試聲，叫做\u003cstrong>掃頻\u003c/strong>。其中一組掃頻長 4.05 秒，每秒記下 48,000 筆。研究把各頻率送出與收到的變化拿來比較，能看出一條路徑在不同頻率的大小和到達時機。\u003c/p>\u003cp>研究繞開了原廠降噪電路，公開的是聲音路徑。前面的 0.4 是這堂課從假想讀數算出的單一比例。\u003c/p>\u003c/div>\n\u003cdetails>\u003csummary>為什麼同時需要記下大小與到達時間？\u003c/summary>即使大小剛好，補償聲到了不同時刻，也可能錯過要抵消的那一刻。\u003c/details>\n", [9]], ["再開風扇：用兩筆量測求出兩個權重", "保持同一戴法、關閉補償，讓同一台風扇繼續吹。同步記下外側麥克風和目標測點的讀數。先問測點要抵消多少，再用上一頁的 0.4 反推喇叭要送多少。", "\n\u003cfigure class=\"teaching\">\n\u003cdiv class=\"cards\">\u003cdiv>\u003cstrong>時刻 A\u003c/strong>\u003cspan>外側現在 +4、前一筆 +2。\u003c/span>\u003cspan>測點的風扇聲 +1.0，要補 −1.0。\u003c/span>\u003cspan>喇叭要送 −1.0 ÷ 0.4 ＝ \u003cstrong>−2.5\u003c/strong>。\u003c/span>\u003c/div>\n\u003cdiv>\u003cstrong>時刻 B\u003c/strong>\u003cspan>外側現在 +2、前一筆 +4。\u003c/span>\u003cspan>測點的風扇聲 +0.8，要補 −0.8。\u003c/span>\u003cspan>喇叭要送 −0.8 ÷ 0.4 ＝ \u003cstrong>−2.0\u003c/strong>。\u003c/span>\u003c/div>\u003c/div>\n\u003cfigcaption>兩組是假想量測。從每欄的測點風扇聲往下讀，先翻方向，再除以播放路徑的比例。只看 A，會有很多對權重都能算出 −2.5，所以再用 B 一起決定。\u003c/figcaption>\n\u003c/figure>\n\u003cp>\u003cstrong>權重\u003c/strong>就是現在與前一筆各要乘多少。讓兩組讀數都算對，可以求出同一對權重 \u003cstrong>−0.5、−0.25\u003c/strong>。播放時把每筆數字乘各自的權重再相加，這裡只用兩筆的規則就是一種 \u003cstrong>FIR 濾波器\u003c/strong>。\u003c/p>\n\u003cdetails>\u003csummary>看這兩個權重怎麼解出來\u003c/summary>\n\u003cp>把現在的權重叫 a，前一筆的叫 b。A 給出 4a＋2b＝−2.5，B 給出 2a＋4b＝−2.0。把 B 的兩邊乘以二，再減去 A，a 就消掉，剩下 6b＝−1.5。所以 b＝−0.25。把 b 代回 A，就得到 a＝−0.5。\u003c/p>\n\u003cp>驗算 A：+4 × (−0.5) ＋ +2 × (−0.25)＝−2.5。經播放路徑乘 0.4，測點才收到 −1，跟原聲 +1 相加剩 0。如果只把外側 +4 翻成 −4，測點收到 −1.6，兩路相加反而還剩 −0.6。\u003c/p>\n\u003c/details>\n\u003cdiv class=\"research-note\">\u003cstrong>實務怎麼選？\u003c/strong>\u003cp>Rivera Benois 等人的固定前饋研究用實測路徑模擬，以降低耳膜位置的預測剩餘聲為目標，求一組 512 個控制權重。研究還比較用多次重新戴入的資料一起求解。固定做法在播放時使用這組求好的權重。\u003c/p>\u003c/div>\n", [9, 2, 4]], ["重新戴一次，耳機怎麼調整原來的權重？", "有些設計會用內側麥克風量兩道聲音相加後剩多少。接續前兩頁：風扇還在，假想這次重新戴好後，播放路徑變弱。", "\n\u003cfigure class=\"teaching\">\u003cdiv class=\"cards\">\n\u003cdiv>\u003cstrong>① 路徑估計改變\u003c/strong>\u003cspan>假設同樣送出 10，現在只量到 3.2，模型從 0.4 變成 \u003cstrong>0.32\u003c/strong>。\u003c/span>\u003c/div>\n\u003cdiv>\u003cstrong>② 用舊權重量剩餘\u003c/strong>\u003cspan>原指令 −2.5，乘 0.32 後收到 −0.8。原聲仍取 +1，量到剩 \u003cstrong>+0.2\u003c/strong>。\u003c/span>\u003c/div>\n\u003cdiv>\u003cstrong>③ 微調兩個權重\u003c/strong>\u003cspan>先用新路徑修正兩筆外側讀數成 1.28、0.64，再把剩餘 +0.2 和它們一起用來微調。\u003c/span>\u003c/div>\n\u003c/div>\u003cfigcaption>按 ① → ③ 看。這是時間已對齊、且已取得新路徑估計的教學例子。量路徑和用剩餘聲調權重是兩個步驟，何時重測由設計決定。\u003c/figcaption>\u003c/figure>\n\u003cp>這種把播放路徑也算進權重更新的方法叫 \u003cstrong>FxLMS\u003c/strong>。送給喇叭的指令仍由原本的外側讀數乘各自的權重算出來。Bai 等人的耳機研究摘要比較了固定和自動調整的控制器。\u003c/p>\n\u003cdetails>\u003csummary>用 A 的 +4、+2 手算一次微調\u003c/summary>\n\u003cp>先把兩筆外側讀數乘 0.32：4 × 0.32＝1.28，2 × 0.32＝0.64。假設每次調整尺度（步長）是 0.1。\u003c/p>\n\u003cp>現在的權重：−0.5 − 0.1 × 0.2 × 1.28＝\u003cstrong>−0.5256\u003c/strong>。前一筆：−0.25 − 0.1 × 0.2 × 0.64＝\u003cstrong>−0.2628\u003c/strong>。\u003c/p>\n\u003cp>用相同的 +4、+2 和原聲 +1 做對照試算，新指令是 −2.628。乘 0.32 後加回原聲，剩 +0.15904，約 \u003cstrong>+0.16\u003c/strong>。實際下一刻會收到新數字，所以即時效果要再看讀數。\u003c/p>\n\u003c/details>\n\u003cdetails>\u003csummary>量到 0.32，等於已經換好兩個權重嗎？\u003c/summary>0.32 描述喇叭到測點的變化。兩個權重還要用外側讀數和量到的剩餘聲來調。\u003c/details>\n", [9, 7]], ["用自己的話，把整條過程說一遍", "回到第一頁的耳機。你不播音樂，也聽到風扇或說話聲。試著把耳罩、麥克風、喇叭和耳朵串成一個解釋。", "\n\u003cfigure class=\"teaching\">\u003cdiv class=\"path long-path\">\u003cspan>外面有聲音\u003c/span>\u003cb aria-hidden=\"true\">→\u003c/b>\u003cspan>耳罩擋住一部分\u003c/span>\u003cb aria-hidden=\"true\">→\u003c/b>\u003cspan>開啟降噪後加上補償聲\u003c/span>\u003cb aria-hidden=\"true\">→\u003c/b>\u003cspan>耳邊還可能有剩下的聲音\u003c/span>\u003c/div>\u003cfigcaption>沿圖說一遍，再打開下面的答案核對。\u003c/figcaption>\u003c/figure>\n\u003cdetails>\u003csummary>第一題：關掉降噪，為什麼戴上仍可能變安靜？\u003c/summary>耳罩或耳塞仍在聲音傳入的路上，提供被動隔音。\u003c/details>\n\u003cdetails>\u003csummary>第二題：為什麼多播放一道聲音可以讓耳邊變安靜？\u003c/summary>兩道聲音在耳邊相加。若原來使壓力上升的時候，補償聲恰好讓壓力降低，合起來的變化就較小。\u003c/details>\n\u003cdetails>\u003csummary>第三題：低鳴變小，人聲仍聽懂，表示降噪失效嗎？\u003c/summary>單憑聽懂人聲無法判斷。先比較開關是否改變聲音，再問哪一些頻率減少、這些差異是否影響辨認句子。\u003c/details>\n\u003cdetails>\u003csummary>第四題：頁面寫「混合」，下一步要看什麼才能比較效果？\u003c/summary>先看量測位置、開關和戴法是否一致，再按自己關心的問題找全頻、生活情境或風噪測試。\u003c/details>\n\u003cdetails>\u003csummary>第五題：處理器算出 −2.5，接著哪些部分把它變成補償聲？\u003c/summary>數位轉類比電路把數字轉成電訊號，放大電路提供所需電力，小喇叭推動空氣。聲音傳到耳邊之後，再與原聲相加。\u003c/details>\n\u003cp>可以回到任何一頁重新試算，或點下面的 Wiki 開始完整閱讀。\u003c/p>\n", [6, 1, 2, 3, 5, 7, 8, 9]]];
// Original pictograms drawn for the offline lesson. The text and teaching figures
// carry the same information for readers who cannot see these decorative stickers.
function drawSticker(canvas, page) {
 const kind = ['headphones','fan','speaker','wave','wave','wave','mic','clock','speech',
  'chart','chart','mic','headphones','wind','clock','chart','fan','wave','speaker','mic','headphones'][page - 1];
 const ctx = canvas.getContext('2d');
 const palettes = {
  headphones:['#efdff9','#9767b2'], fan:['#d9efed','#4d998d'], speaker:['#ffe8cc','#d47c48'],
  wave:['#dcf2e4','#37806d'], mic:['#ffe6d3','#bd6747'], clock:['#f8edce','#b88731'],
  speech:['#fbe1e9','#ba5779'], chart:['#deecfb','#557fb2'], wind:['#d9f0f7','#4d91a8']
 };
 const [paper, accent] = palettes[kind];
 const ink = '#233c45';
 const path = (points, color = ink, width = 3) => {
  ctx.beginPath();
  points.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.stroke();
 };
 const circle = (x, y, r, fill) => {
  ctx.beginPath();ctx.arc(x, y, r, 0, 2 * Math.PI);
  ctx.fillStyle = fill;ctx.fill();ctx.strokeStyle = ink;ctx.lineWidth = 2;ctx.stroke();
 };
 const box = (x, y, w, h, radius, fill, outline = ink) => {
  ctx.beginPath();ctx.roundRect(x, y, w, h, radius);
  ctx.fillStyle = fill;ctx.fill();ctx.strokeStyle = outline;ctx.lineWidth = 2;ctx.stroke();
 };
 ctx.lineCap = 'round';ctx.lineJoin = 'round';
 box(7, 8, 106, 91, 28, paper, '#fff');
 path([[20,25],[20,35]],accent,2);path([[15,30],[25,30]],accent,2);
 path([[100,73],[100,83]],accent,2);path([[95,78],[105,78]],accent,2);
 switch (kind) {
  case 'headphones':
   ctx.beginPath();ctx.arc(60, 53, 24, Math.PI, 2 * Math.PI);
   ctx.strokeStyle = ink;ctx.lineWidth = 6;ctx.stroke();
   box(29, 53, 16, 25, 6, accent);box(75, 53, 16, 25, 6, accent);break;
  case 'fan':
   circle(60, 51, 26, '#fff');
   for (let i = 0; i < 3; i++) {
    ctx.save();ctx.translate(60, 51);ctx.rotate(i * 2 * Math.PI / 3);
    ctx.beginPath();ctx.ellipse(4, -11, 6, 11, .55, 0, 2 * Math.PI);
    ctx.fillStyle = accent;ctx.fill();ctx.restore();
   }
   circle(60, 51, 5, '#fff');path([[60,78],[60,86],[48,86],[72,86]]);break;
  case 'speaker':
   box(29, 35, 32, 40, 8, accent);circle(45, 55, 9, '#fff');
   path([[68,46],[75,55],[68,64]]);path([[80,39],[91,55],[80,71]]);break;
  case 'wave':
   path([[24,55],[96,55]],'#77968e',2);
   path(Array.from({length:73},(_,i)=>[24+i,55-17*Math.sin(i/72*4*Math.PI)]),accent,4);break;
  case 'mic':
   box(49, 27, 22, 42, 11, accent);
   ctx.beginPath();ctx.arc(60, 58, 19, 0, Math.PI);
   ctx.strokeStyle=ink;ctx.lineWidth=3;ctx.stroke();
   path([[60,77],[60,85],[49,85],[71,85]]);break;
  case 'clock':
   circle(60, 54, 25, '#fff');path([[60,36],[60,55],[73,61]],accent,4);
   circle(60, 55, 2, accent);break;
  case 'speech':
   box(32, 33, 56, 37, 12, '#fff');path([[50,70],[42,80],[42,70]]);
   for (const x of [47, 60, 73]) circle(x,52,3,accent);
   break;
  case 'chart':
   path([[32,32],[32,76],[90,76]]);
   path([[37,40],[56,54],[80,63]],accent,4);
   for (const [x,y] of [[37,40],[56,54],[80,63]]) circle(x,y,4,accent);
   break;
  case 'wind':
   path([[26,43],[77,43],[87,36],[87,30],[81,26],[75,30]],accent,4);
   path([[30,55],[90,55]],accent,4);
   path([[39,68],[74,68],[82,75],[78,82],[70,79]],accent,4);break;
 }
}

const main=document.querySelector('main');
function draw(){
 const angle = Number(document.querySelector('#phase').value);
 const phi = angle * Math.PI / 180;
 const {width, height} = document.querySelector('#wave');
 const ctx = document.querySelector('#wave').getContext('2d');
 const left = 124, right = width - 18, period = (right - left) / 2;
 ctx.clearRect(0, 0, width, height);
 ctx.strokeStyle = '#e3b887';
 ctx.beginPath(); ctx.moveTo(left + period / 4, 23); ctx.lineTo(left + period / 4, 258); ctx.stroke();
 const rows = [
  ['第一道聲音', '#ffb56f', 57, t => Math.sin(t)],
  ['第二道聲音', '#ffffff', 143, t => Math.sin(t + phi)],
  ['兩道相加', '#65daba', 229, t => Math.sin(t) + Math.sin(t + phi)]
 ];
 ctx.font = '21px sans-serif';
 for (const [label, color, center, wave] of rows) {
  ctx.fillStyle = color;
  ctx.fillText(label, 12, center + 7);
  paintWave(ctx, left, right, center, 15, 2, wave, color);
 }
 ctx.fillStyle = '#fff';
 ctx.fillText('時間 →', right - 72, height - 8);
 document.querySelector('#result').textContent = angle + '°：第三排的起伏高度是第一道的 ' + (2 * Math.cos(phi / 2)).toFixed(2) + ' 倍。';
 for (const button of document.querySelectorAll('[data-phase]')) {
  button.setAttribute('aria-pressed', String(Number(button.dataset.phase) === angle));
 }
}

function paintWave(ctx, left, right, center, amplitude, cycles, wave, color) {
 ctx.strokeStyle = '#a4baba';
 ctx.lineWidth = 1.5;
 ctx.setLineDash([5, 5]);
 ctx.beginPath(); ctx.moveTo(left, center); ctx.lineTo(right, center); ctx.stroke();
 ctx.setLineDash([]);
 ctx.strokeStyle = color;
 ctx.lineWidth = 3;
 ctx.beginPath();
 for (let x = left; x <= right; x++) {
  const y = center - amplitude * wave((x - left) / (right - left) * cycles * 2 * Math.PI);
  if (x === left) ctx.moveTo(x, y);
  else ctx.lineTo(x, y);
 }
 ctx.stroke();
}

function drawFrequencyCurve(canvas) {
 const ctx = canvas.getContext('2d');
 const left = 55, floor = 185, right = 325, top = 35;
 const points = [[100, 20], [1000, 5], [4000, 1]];
 const x = hz => left + (hz / 4000) * (right - left);
 const y = db => floor - (db / 20) * (floor - top);
 ctx.font = '15px sans-serif';
 ctx.fillStyle = '#ffffff';
 ctx.strokeStyle = '#789194';
 ctx.textAlign = 'right';
 for (const db of [0, 5, 10, 15, 20]) {
  ctx.fillText(db + ' dB', left - 8, y(db) + 5);
  ctx.beginPath(); ctx.moveTo(left, y(db)); ctx.lineTo(right, y(db)); ctx.stroke();
 }
 ctx.fillText('減少量', left + 12, 22);
 ctx.strokeStyle = '#ffc085';
 ctx.setLineDash([4, 4]);
 ctx.beginPath(); ctx.moveTo(x(100), floor); ctx.lineTo(x(100), y(20)); ctx.lineTo(left, y(20)); ctx.stroke();
 ctx.setLineDash([]);
 ctx.textAlign = 'center';
 for (const [hz] of points) ctx.fillText(hz + ' Hz', x(hz), floor + 22);
 ctx.fillText('頻率（每秒重複次數）', (left + right) / 2, floor + 49);
 ctx.strokeStyle = '#65daba';
 ctx.lineWidth = 3;
 ctx.beginPath();
 for (const [index, [hz, db]] of points.entries()) {
  if (index === 0) ctx.moveTo(x(hz), y(db));
  else ctx.lineTo(x(hz), y(db));
 }
 ctx.stroke();
 ctx.fillStyle = '#ffb56f';
 for (const [hz, db] of points) {
  ctx.beginPath(); ctx.arc(x(hz), y(db), 5, 0, 2 * Math.PI); ctx.fill();
 }
}

function render() {
 const key = location.hash.slice(1) || '1';
 const wiki = key === 'wiki' || /^wiki-\d+$/.test(key);
 const flow = key === 'flow';
 const requested = Number(key);
 const page = /^\d+$/.test(key) && requested >= 1 && requested <= slides.length ? requested : 1;
 if (wiki) {
  const links = notes.map(([id, title]) => `<li><a href="#wiki-${id}">${title}</a></li>`).join('');
  const articles = notes.map(([id, title], index) => `<article id="w${id}"><h2>${title}</h2>${knowledge[index]}</article>`).join('');
  main.innerHTML = '<h1>從耳機開始的 Wiki</h1><p>第一次看，從第一篇開始。每篇都有生活例子、自我檢查和下一步。</p><nav aria-label="Wiki 目錄"><ol>' + links + '</ol></nav>' + articles;
 } else if (flow) {
  main.innerHTML = workflow;
 } else {
  const [title, lead, body, refs] = slides[page - 1];
  const wikiLinks = refs.map(id => {
   const [, label] = notes.find(([noteId]) => noteId === id);
   return `<li><a href="#wiki-${id}">${label}</a></li>`;
  }).join('');
  main.innerHTML = `<small>第 ${page} 頁，共 ${slides.length} 頁</small><div class="slide-heading"><h1>${title}</h1><canvas class="slide-sticker" width="120" height="108" aria-hidden="true"></canvas></div><p>${lead}</p>${body}<details><summary>在 Wiki 讀更多</summary><ul>${wikiLinks}</ul></details>`;
  drawSticker(main.querySelector('.slide-sticker'), page);
  const phase = document.querySelector('#phase');
  if (phase) {
   draw();
   phase.oninput = draw;
   for (const button of document.querySelectorAll('[data-phase]')) {
    button.onclick = () => { phase.value = button.dataset.phase; draw(); };
   }
  }
  for (const canvas of document.querySelectorAll('[data-cycles]')) {
   paintWave(canvas.getContext('2d'), 10, 290, 46, Number(canvas.dataset.height), Number(canvas.dataset.cycles), Math.sin, '#65daba');
  }
  const curve = document.querySelector('#frequency-curve');
  if (curve) drawFrequencyCurve(curve);
 }
 footer.hidden = wiki || flow;
 footer.style.display = footer.hidden ? 'none' : '';
 prev.disabled = page === 1;
 next.disabled = page === slides.length;
 prev.onclick = () => { location.hash = page - 1; };
 next.onclick = () => { location.hash = page + 1; };
 document.querySelector('#position').textContent = page + ' / ' + slides.length;
 window.scrollTo(0, 0);
 if (wiki && key !== 'wiki') document.getElementById('w' + key.slice(5))?.scrollIntoView();
}
const workflow="\u003ch2>耳機降噪：從一聲風扇聲開始\u003c/h2>\n\u003cp>這是一份給零基礎讀者的 LLM Wiki 與二十一頁 HTML 教學。先從耳機零件和日常聽感入手，再用波形、量測和手算來理解補償聲。\u003c/p>\n\u003ch3>工作流程\u003c/h3>\n\u003cp>討論目標 → 拆解問題 → 查證來源 → 深挖零件與運算 → 更新 Wiki → 編排簡報 → 逐頁查核。每個知識點都重複查證。來源不足就回到取材，機制或中間步驟缺漏就先補 Wiki。投影片讀圖或操作出現問題時，修改簡報並重新建置。這樣可以先確認知識的根據，再把它講給初學者聽。\u003c/p>\n\u003ch3>一次實際執行\u003c/h3>\n\u003cp>早期第 18 到 20 頁展示了如何用係數算補償聲，但讀者仍不知道 0.4、−0.5 和 −0.25 從哪裡來。我們回查耳機掃頻量測和固定濾波器研究，先在 Wiki 加入路徑量測、兩筆風扇讀數解權重及再佩戴後的更新算例，再重做三頁。實際研究與課堂假想數字分開標示。\u003c/p>\n\u003ch3>反思\u003c/h3>\n\u003cp>反覆出現的問題在把研究整理成可理解的教學。即使算式正確，少了數字怎麼量出來或怎麼解出來，初學者還是會卡住。我們把這項檢查從看完成簡報提前到寫 Wiki 和逐頁大綱。更新的工作流程在查證與編排之前明列技術深挖，要求先交代零件、輸入、運算、輸出與條件。\u003c/p>\n\u003ch3>查核結果\u003c/h3>\n\u003cp>二十一頁都能追溯到 Wiki（21／21）。簡報利用了九篇 Wiki（9／9）中的 34／40 個可教主題小節。十二份已核讀來源附有閱讀紀錄。算例、站內連結與投影片程式檢查已通過，最新一次窄視窗的實際瀏覽器檢查尚無結果。\u003c/p>\n\u003cp>\u003ca href=\"#wiki\">閱讀 Wiki\u003c/a> · \u003ca href=\"#1\">教學大綱\u003c/a> · \u003ca href=\"./audit.html\">逐頁與來源查核\u003c/a> · \u003ca href=\"#1\">開啟簡報\u003c/a>\u003c/p>";
document.addEventListener('keydown', event => {
 if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey || event.target.matches?.('input, textarea, select, [contenteditable]')) return;
 if (location.hash && !/^#\d+$/.test(location.hash)) return;
 const button = { ArrowLeft: prev, ArrowRight: next }[event.key];
 if (button && !button.disabled) { event.preventDefault(); button.click(); }
});
window.onhashchange=render;render();
</script></html>
